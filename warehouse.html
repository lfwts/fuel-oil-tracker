<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>仓库管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f0f1a;
            --bg2: #1a1a2e;
            --card: #252540;
            --card2: #2d2d4a;
            --gold: #f59e0b;
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --text: #f1f5f9;
            --muted: #64748b;
            --border: #3d3d5c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
        }
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg2), #16213e);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--gold), #d97706);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .logo-text { font-size: 18px; font-weight: 700; }
        .logo-sub { font-size: 11px; color: var(--muted); }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            width: 36px; height: 36px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            background: var(--bg2);
            margin: 12px 16px;
            border-radius: 12px;
            padding: 4px;
            gap: 2px;
        }
        .tab {
            flex: 1;
            padding: 10px 4px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 11px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .tab.active { background: var(--card); color: var(--gold); }
        .tab-icon { font-size: 18px; }
        
        /* Panel */
        .panel { display: none; padding: 16px; }
        .panel.active { display: block; }
        
        /* Section */
        .section { margin-bottom: 20px; }
        .section-title {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-value { font-size: 28px; font-weight: 700; font-family: monospace; }
        .stat-value.green { color: var(--green); }
        .stat-value.red { color: var(--red); }
        .stat-value.gold { color: var(--gold); }
        .stat-value.blue { color: var(--blue); }
        .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
        
        /* Alert */
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-red { background: rgba(239,68,68,0.15); border: 1px solid var(--red); color: var(--red); }
        .alert-green { background: rgba(16,185,129,0.15); border: 1px solid var(--green); color: var(--green); }
        .alert-gold { background: rgba(245,158,11,0.15); border: 1px solid var(--gold); color: var(--gold); }
        
        /* Cards */
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .card-meta { font-size: 11px; color: var(--muted); }
        
        /* Part Item */
        .part-item {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .part-icon { font-size: 28px; }
        .part-info { flex: 1; }
        .part-name { font-size: 15px; font-weight: 600; }
        .part-category { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .part-stock {
            text-align: right;
        }
        .part-stock-num {
            font-size: 24px;
            font-weight: 700;
            font-family: monospace;
        }
        .part-stock-num.low { color: var(--red); }
        .part-stock-num.ok { color: var(--green); }
        .part-stock-unit { font-size: 11px; color: var(--muted); }
        .part-warning {
            font-size: 11px;
            color: var(--red);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Record Item */
        .record-item {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border-left: 4px solid var(--blue);
        }
        .record-item.out { border-left-color: var(--red); }
        .record-item.ret { border-left-color: var(--green); }
        .record-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .record-title { font-size: 14px; font-weight: 600; }
        .record-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .badge-out { background: rgba(239,68,68,0.2); color: var(--red); }
        .badge-ret { background: rgba(16,185,129,0.2); color: var(--green); }
        .record-meta { font-size: 12px; color: var(--muted); }
        .record-meta span { margin-right: 12px; }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg2);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 100;
        }
        .nav-item {
            flex: 1;
            padding: 12px 4px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-item.active { color: var(--gold); }
        .nav-icon { font-size: 22px; }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg2);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title { font-size: 18px; font-weight: 700; }
        .modal-close {
            width: 32px; height: 32px;
            background: var(--card);
            border: none;
            border-radius: 50%;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
        }
        
        /* Form */
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--gold);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* Number Stepper */
        .stepper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .stepper-btn {
            width: 44px; height: 44px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .stepper-btn:active { background: var(--gold); }
        .stepper-val {
            font-size: 28px;
            font-weight: 700;
            font-family: monospace;
            min-width: 50px;
            text-align: center;
        }
        
        /* Button */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 6px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--gold), #d97706); color: #000; }
        .btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: rgba(239,68,68,0.2); color: var(--red); border: 1px solid var(--red); }
        .btn:active { transform: scale(0.98); }
        
        /* Empty */
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
        }
        .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
        .empty-text { font-size: 14px; }
        
        /* Filter */
        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .filter-row .form-input, .filter-row .form-select {
            padding: 10px 12px;
            font-size: 13px;
        }
        
        /* Person tag */
        .person-tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(59,130,246,0.2);
            color: var(--blue);
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        
        /* Search */
        .search-bar {
            position: relative;
            margin-bottom: 16px;
        }
        .search-bar input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
        }
        .search-bar input::placeholder { color: var(--muted); }
        .search-bar input:focus { outline: none; border-color: var(--gold); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; }
        
        /* List item */
        .list-item {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-item-info { flex: 1; }
        .list-item-name { font-size: 14px; font-weight: 600; }
        .list-item-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .list-item-action {
            color: var(--gold);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }
        
        @media (min-width: 500px) {
            body { padding-bottom: 0; }
            .bottom-nav { position: static; background: var(--bg2); border: none; border-top: 1px solid var(--border); }
            .modal { border-radius: 20px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); bottom: auto; max-height: 80vh; }
            .modal-overlay { align-items: center; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-icon">📦</div>
                <div>
                    <div class="logo-text">仓库管理</div>
                    <div class="logo-sub">麻章区鑫旺商行</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="showModal('settingsModal')">⚙️</button>
            </div>
        </div>
    </header>
    
    <!-- Tabs -->
    <nav class="tabs">
        <button class="tab active" data-tab="home" onclick="switchTab('home')">
            <span class="tab-icon">🏠</span>
            首页
        </button>
        <button class="tab" data-tab="parts" onclick="switchTab('parts')">
            <span class="tab-icon">🧰</span>
            配件
        </button>
        <button class="tab" data-tab="checkout" onclick="switchTab('checkout')">
            <span class="tab-icon">📤</span>
            领用
        </button>
        <button class="tab" data-tab="records" onclick="switchTab('records')">
            <span class="tab-icon">📋</span>
            记录
        </button>
    </nav>
    
    <!-- Home Panel -->
    <div id="home-panel" class="panel active">
        <div class="section">
            <div class="section-title">📊 库存概览</div>
            <div class="stats-grid" id="homeStats"></div>
        </div>
        
        <div id="lowStockAlert"></div>
        
        <div class="section">
            <div class="section-title">🚨 库存预警</div>
            <div id="lowStockList"></div>
        </div>
        
        <div class="section">
            <div class="section-title">📋 今日动态</div>
            <div id="todayActivity"></div>
        </div>
    </div>
    
    <!-- Parts Panel -->
    <div id="parts-panel" class="panel">
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchParts" placeholder="搜索配件..." oninput="filterParts()">
        </div>
        <div id="partsCategoryFilter" class="filter-row"></div>
        <div id="partsList"></div>
    </div>
    
    <!-- Checkout Panel -->
    <div id="checkout-panel" class="panel">
        <div class="section">
            <div class="section-title">📤 领用配件</div>
            <div class="card">
                <div class="form-group">
                    <label class="form-label">配件名称</label>
                    <select class="form-select" id="checkoutPart" onchange="updateCheckoutStock()">
                        <option value="">请选择配件</option>
                    </select>
                </div>
                <div id="checkoutStockInfo" style="text-align:center;margin-bottom:12px;font-size:13px;color:var(--muted);"></div>
                <div class="form-group">
                    <label class="form-label">领取人</label>
                    <select class="form-select" id="checkoutPerson">
                        <option value="">请选择领取人</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">领取数量</label>
                    <div class="stepper">
                        <button class="stepper-btn" onclick="changeQty('checkoutQty', -1)">−</button>
                        <span class="stepper-val" id="checkoutQty">1</span>
                        <button class="stepper-btn" onclick="changeQty('checkoutQty', 1)">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">备注（可选）</label>
                    <input type="text" class="form-input" id="checkoutNote" placeholder="备注信息...">
                </div>
                <button class="btn btn-primary" onclick="doCheckout()">📤 确认领用</button>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">📥 归还配件</div>
            <div class="card">
                <div class="form-group">
                    <label class="form-label">配件名称</label>
                    <select class="form-select" id="returnPart" onchange="updateReturnList()">
                        <option value="">请选择配件</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">归还人</label>
                    <select class="form-select" id="returnPerson">
                        <option value="">请选择归还人</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">归还数量</label>
                    <div class="stepper">
                        <button class="stepper-btn" onclick="changeQty('returnQty', -1)">−</button>
                        <span class="stepper-val" id="returnQty">1</span>
                        <button class="stepper-btn" onclick="changeQty('returnQty', 1)">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">备注（可选）</label>
                    <input type="text" class="form-input" id="returnNote" placeholder="备注信息...">
                </div>
                <button class="btn btn-secondary" onclick="doReturn()">📥 确认归还</button>
            </div>
        </div>
    </div>
    
    <!-- Records Panel -->
    <div id="records-panel" class="panel">
        <div class="filter-row">
            <select class="form-input" id="filterType" onchange="loadRecords()">
                <option value="">全部类型</option>
                <option value="out">领用</option>
                <option value="ret">归还</option>
            </select>
            <select class="form-input" id="filterPerson" onchange="loadRecords()">
                <option value="">全部人员</option>
            </select>
        </div>
        <div class="filter-row">
            <input type="date" class="form-input" id="filterDate" onchange="loadRecords()">
        </div>
        <div id="recordsList"></div>
    </div>
    
    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home')">
            <span class="nav-icon">🏠</span>
            首页
        </button>
        <button class="nav-item" onclick="switchTab('parts')">
            <span class="nav-icon">🧰</span>
            配件
        </button>
        <button class="nav-item" onclick="switchTab('checkout')">
            <span class="nav-icon">📤</span>
            领用
        </button>
        <button class="nav-item" onclick="switchTab('records')">
            <span class="nav-icon">📋</span>
            记录
        </button>
    </nav>
    
    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">⚙️ 系统设置</div>
                <button class="modal-close" onclick="closeModal('settingsModal')">×</button>
            </div>
            
            <div class="section">
                <div class="section-title">👷 人员管理</div>
                <div id="personList"></div>
                <button class="btn btn-secondary" onclick="showAddPerson()">➕ 添加人员</button>
            </div>
            
            <div class="section" style="margin-top:20px;">
                <div class="section-title">🗂️ 配件分类</div>
                <div id="categoryList"></div>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <input type="text" class="form-input" id="newCategoryInput" placeholder="新分类名称" style="flex:1;">
                    <button class="btn btn-secondary" onclick="addCategory()" style="width:auto;padding:12px 16px;">添加</button>
                </div>
            </div>
            
            <div class="section" style="margin-top:20px;">
                <div class="section-title">📦 配件管理</div>
                <div id="allPartsManage"></div>
                <button class="btn btn-secondary" onclick="showAddPart()">➕ 添加配件</button>
            </div>
            
            <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);">
                <button class="btn btn-danger" onclick="exportData()">📤 导出数据</button>
                <button class="btn btn-secondary" onclick="importData()" style="margin-top:8px;">📥 导入数据</button>
            </div>
        </div>
    </div>
    
    <!-- Add Part Modal -->
    <div class="modal-overlay" id="addPartModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="addPartTitle">➕ 添加配件</div>
                <button class="modal-close" onclick="closeModal('addPartModal')">×</button>
            </div>
            <input type="hidden" id="editPartId">
            <div class="form-group">
                <label class="form-label">配件名称 *</label>
                <input type="text" class="form-input" id="partNameInput" placeholder="如：油泵、喷油嘴">
            </div>
            <div class="form-group">
                <label class="form-label">规格型号</label>
                <input type="text" class="form-input" id="partModelInput" placeholder="如：CD-100、12V">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">库存数量</label>
                    <input type="number" class="form-input" id="partStockInput" placeholder="0" min="0">
                </div>
                <div class="form-group">
                    <label class="form-label">警戒库存</label>
                    <input type="number" class="form-input" id="partAlertInput" placeholder="5" min="0">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">分类</label>
                <select class="form-select" id="partCategoryInput"></select>
            </div>
            <div class="form-group">
                <label class="form-label">备注</label>
                <input type="text" class="form-input" id="partNoteInput" placeholder="备注信息...">
            </div>
            <button class="btn btn-primary" onclick="savePart()">💾 保存配件</button>
        </div>
    </div>
    
    <!-- Add Person Modal -->
    <div class="modal-overlay" id="addPersonModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">👷 添加人员</div>
                <button class="modal-close" onclick="closeModal('addPersonModal')">×</button>
            </div>
            <input type="hidden" id="editPersonId">
            <div class="form-group">
                <label class="form-label">姓名 *</label>
                <input type="text" class="form-input" id="personNameInput" placeholder="姓名">
            </div>
            <div class="form-group">
                <label class="form-label">电话</label>
                <input type="tel" class="form-input" id="personPhoneInput" placeholder="手机号码">
            </div>
            <div class="form-group">
                <label class="form-label">角色</label>
                <select class="form-select" id="personRoleInput">
                    <option value="driver">司机</option>
                    <option value="worker">工人</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="savePerson()">💾 保存</button>
        </div>
    </div>
    
    <!-- Part Detail Modal -->
    <div class="modal-overlay" id="partDetailModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="detailTitle">配件详情</div>
                <button class="modal-close" onclick="closeModal('partDetailModal')">×</button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

<script>
// ==================== 数据模型 ====================
const DEFAULT_DATA = {
    persons: [
        { id: 1, name: '莫哥', phone: '', role: 'driver' },
        { id: 2, name: '李吟', phone: '', role: 'driver' },
        { id: 3, name: '王琼', phone: '', role: 'driver' },
        { id: 4, name: '光福', phone: '', role: 'driver' }
    ],
    categories: [
        { id: 1, name: '油泵' },
        { id: 2, name: '喷油嘴' },
        { id: 3, name: '点火配件' },
        { id: 4, name: '胶带管材' },
        { id: 5, name: '其他' }
    ],
    parts: [
        { id: 1, name: '油泵', model: '标准型', stock: 12, alertStock: 3, categoryId: 1, note: '', history: [] },
        { id: 2, name: '油泵', model: '高压型', stock: 5, alertStock: 2, categoryId: 1, note: '', history: [] },
        { id: 3, name: '喷油嘴', model: '细雾型', stock: 20, alertStock: 5, categoryId: 2, note: '', history: [] },
        { id: 4, name: '喷油嘴', model: '标准型', stock: 8, alertStock: 3, categoryId: 2, note: '', history: [] },
        { id: 5, name: '点火器', model: '12V', stock: 6, alertStock: 2, categoryId: 3, note: '', history: [] },
        { id: 6, name: '高压包', model: '通用', stock: 4, alertStock: 2, categoryId: 3, note: '', history: [] },
        { id: 7, name: '耐高温胶带', model: '10米', stock: 15, alertStock: 5, categoryId: 4, note: '', history: [] },
        { id: 8, name: '油管', model: 'DN8', stock: 10, alertStock: 3, categoryId: 4, note: '', history: [] },
        { id: 9, name: '法兰盘', model: '标准', stock: 6, alertStock: 2, categoryId: 5, note: '', history: [] },
        { id: 10, name: '密封圈', model: '套装', stock: 30, alertStock: 10, categoryId: 5, note: '', history: [] }
    ],
    records: [],
    nextPartId: 11,
    nextPersonId: 5,
    nextCategoryId: 6
};

// ==================== 初始化 ====================
let data = JSON.parse(localStorage.getItem('warehouseData')) || DEFAULT_DATA;

function save() {
    localStorage.setItem('warehouseData', JSON.stringify(data));
}

function getCategoryName(id) {
    const c = data.categories.find(x => x.id === id);
    return c ? c.name : '其他';
}

function getPersonName(id) {
    const p = data.persons.find(x => x.id === id);
    return p ? p.name : '未知';
}

function formatDate(d) {
    const dt = new Date(d);
    const now = new Date();
    const isToday = dt.toDateString() === now.toDateString();
    if (isToday) {
        return '今天 ' + dt.toTimeString().slice(0,5);
    }
    return `${dt.getMonth()+1}/${dt.getDate()} ${dt.toTimeString().slice(0,5)}`;
}

// ==================== 页面切换 ====================
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === tab + '-panel'));
    document.querySelectorAll('.nav-item').forEach((n, i) => {
        const tabs = ['home','parts','checkout','records'];
        n.classList.toggle('active', tabs[i] === tab);
    });
    
    if (tab === 'home') renderHome();
    if (tab === 'parts') renderParts();
    if (tab === 'checkout') initCheckout();
    if (tab === 'records') loadRecords();
}

// ==================== 首页 ====================
function renderHome() {
    const totalStock = data.parts.reduce((s, p) => s + p.stock, 0);
    const lowStock = data.parts.filter(p => p.stock <= p.alertStock);
    const todayRecords = data.records.filter(r => {
        const d = new Date(r.time);
        const now = new Date();
        return d.toDateString() === now.toDateString();
    });
    const outToday = todayRecords.filter(r => r.type === 'out').length;
    const retToday = todayRecords.filter(r => r.type === 'ret').length;
    
    document.getElementById('homeStats').innerHTML = `
        <div class="stat-card">
            <div class="stat-value green">${totalStock}</div>
            <div class="stat-label">总库存</div>
        </div>
        <div class="stat-card">
            <div class="stat-value blue">${data.parts.length}</div>
            <div class="stat-label">配件种类</div>
        </div>
        <div class="stat-card">
            <div class="stat-value gold">${outToday}</div>
            <div class="stat-label">今日领用</div>
        </div>
        <div class="stat-card">
            <div class="stat-value red">${lowStock.length}</div>
            <div class="stat-label">库存预警</div>
        </div>
    `;
    
    // 库存预警
    if (lowStock.length > 0) {
        document.getElementById('lowStockAlert').innerHTML = `
            <div class="alert alert-red">
                ⚠️ 有 ${lowStock.length} 种配件库存低于警戒线！
            </div>
        `;
        document.getElementById('lowStockList').innerHTML = lowStock.map(p => `
            <div class="card" onclick="showPartDetail(${p.id})">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <div class="card-title">${p.name}${p.model ? ' (' + p.model + ')' : ''}</div>
                        <div class="card-meta">${getCategoryName(p.categoryId)} · 警戒：${p.alertStock}</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="stat-value red" style="font-size:24px;">${p.stock}</div>
                        <div class="stat-label">当前库存</div>
                    </div>
                </div>
            </div>
        `).join('');
    } else {
        document.getElementById('lowStockAlert').innerHTML = `
            <div class="alert alert-green">✅ 所有配件库存正常</div>
        `;
        document.getElementById('lowStockList').innerHTML = '';
    }
    
    // 今日动态
    if (todayRecords.length > 0) {
        document.getElementById('todayActivity').innerHTML = todayRecords.slice(0,5).map(r => `
            <div class="card" style="padding:10px 14px;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <span style="font-size:16px;">${r.type === 'out' ? '📤' : '📥'}</span>
                        <span style="font-size:14px;font-weight:600;">${r.partName}</span>
                        <span class="person-tag">${getPersonName(r.personId)}</span>
                    </div>
                    <div style="text-align:right;">
                        <span style="font-size:14px;font-weight:700;color:${r.type==='out'?var_red:var_green}">${r.type==='out'?'-':'+'}${r.qty}</span>
                        <div style="font-size:10px;color:var(--muted)">${formatDate(r.time)}</div>
                    </div>
                </div>
            </div>
        `).join('');
    } else {
        document.getElementById('todayActivity').innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">今日暂无记录</div></div>';
    }
}

// ==================== 配件列表 ====================
function renderParts() {
    // 分类筛选
    document.getElementById('partsCategoryFilter').innerHTML = `
        <select class="form-input" id="filterCategory" onchange="filterParts()">
            <option value="">全部分类</option>
            ${data.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
    `;
    
    filterParts();
}

function filterParts() {
    const search = document.getElementById('searchParts').value.toLowerCase();
    const catId = parseInt(document.getElementById('filterCategory')?.value) || 0;
    
    let parts = data.parts;
    if (search) parts = parts.filter(p => p.name.includes(search) || (p.model && p.model.includes(search)));
    if (catId) parts = parts.filter(p => p.categoryId === catId);
    
    if (parts.length === 0) {
        document.getElementById('partsList').innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">没有找到匹配的配件</div></div>';
        return;
    }
    
    document.getElementById('partsList').innerHTML = parts.map(p => {
        const isLow = p.stock <= p.alertStock;
        return `
            <div class="part-item" onclick="showPartDetail(${p.id})">
                <div class="part-icon">${getCategoryIcon(p.categoryId)}</div>
                <div class="part-info">
                    <div class="part-name">${p.name}${p.model ? ' <span style="font-size:12px;color:var(--muted)">'+p.model+'</span>' : ''}</div>
                    <div class="part-category">${getCategoryName(p.categoryId)}</div>
                    ${isLow ? '<div class="part-warning">⚠️ 低于警戒库存</div>' : ''}
                </div>
                <div class="part-stock">
                    <div class="part-stock-num ${isLow ? 'low' : 'ok'}">${p.stock}</div>
                    <div class="part-stock-unit">件</div>
                </div>
            </div>
        `;
    }).join('');
}

function getCategoryIcon(catId) {
    const icons = { 1: '⛽', 2: '💨', 3: '⚡', 4: '🔧', 5: '📦' };
    return icons[catId] || '📦';
}

// ==================== 配件详情 ====================
function showPartDetail(id) {
    const p = data.parts.find(x => x.id === id);
    if (!p) return;
    
    const isLow = p.stock <= p.alertStock;
    const hist = data.records.filter(r => r.partId === id).slice(-10).reverse();
    
    document.getElementById('detailTitle').textContent = p.name + (p.model ? ' (' + p.model + ')' : '');
    document.getElementById('detailContent').innerHTML = `
        <div class="stats-grid" style="margin-bottom:16px;">
            <div class="stat-card">
                <div class="stat-value ${isLow ? 'red' : 'green'}">${p.stock}</div>
                <div class="stat-label">当前库存</div>
            </div>
            <div class="stat-card">
                <div class="stat-value gold">${p.alertStock}</div>
                <div class="stat-label">警戒库存</div>
            </div>
        </div>
        ${isLow ? '<div class="alert alert-red">⚠️ 库存低于警戒线，请及时补充！</div>' : ''}
        
        <div class="card" style="margin-bottom:12px;">
            <div style="font-size:13px;color:var(--muted);margin-bottom:4px;">分类</div>
            <div style="font-size:14px;font-weight:600;">${getCategoryName(p.categoryId)}</div>
        </div>
        ${p.model ? `<div class="card" style="margin-bottom:12px;"><div style="font-size:13px;color:var(--muted);margin-bottom:4px;">规格型号</div><div style="font-size:14px;">${p.model}</div></div>` : ''}
        ${p.note ? `<div class="card" style="margin-bottom:12px;"><div style="font-size:13px;color:var(--muted);margin-bottom:4px;">备注</div><div style="font-size:14px;">${p.note}</div></div>` : ''}
        
        <div class="section-title">📋 最近记录</div>
        ${hist.length === 0 ? '<div class="empty"><div class="empty-text">暂无记录</div></div>' : hist.map(r => `
            <div class="record-item ${r.type === 'out' ? 'out' : 'ret'}">
                <div class="record-header">
                    <div class="record-title">${r.type === 'out' ? '领用' : '归还'} ${r.qty}件</div>
                    <span class="record-badge badge-${r.type}">${r.type === 'out' ? '领用' : '归还'}</span>
                </div>
                <div class="record-meta">
                    <span>👤 ${getPersonName(r.personId)}</span>
                    <span>⏰ ${formatDate(r.time)}</span>
                </div>
                ${r.note ? `<div style="font-size:12px;color:var(--muted);margin-top:4px;">📝 ${r.note}</div>` : ''}
            </div>
        `).join('')}
        
        <button class="btn btn-secondary" onclick="editPartFromDetail(${p.id})" style="margin-top:16px;">✏️ 编辑配件</button>
    `;
    
    showModal('partDetailModal');
}

function editPartFromDetail(id) {
    closeModal('partDetailModal');
    editPart(id);
}

// ==================== 领用/归还 ====================
function initCheckout() {
    // 填充配件下拉
    const checkoutSelect = document.getElementById('checkoutPart');
    checkoutSelect.innerHTML = '<option value="">请选择配件</option>' + 
        data.parts.map(p => `<option value="${p.id}">${p.name}${p.model ? ' ('+p.model+')' : ''} - 库存${p.stock}</option>`).join('');
    
    const returnSelect = document.getElementById('returnPart');
    returnSelect.innerHTML = '<option value="">请选择配件</option>' + 
        data.parts.filter(p => p.stock < 100).map(p => `<option value="${p.id}">${p.name}${p.model ? ' ('+p.model+')' : ''}</option>`).join('');
    
    // 填充人员下拉
    const personOptions = data.persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    document.getElementById('checkoutPerson').innerHTML = '<option value="">请选择领取人</option>' + personOptions;
    document.getElementById('returnPerson').innerHTML = '<option value="">请选择归还人</option>' + personOptions;
    
    // 重置数量
    document.getElementById('checkoutQty').textContent = '1';
    document.getElementById('returnQty').textContent = '1';
    document.getElementById('checkoutNote').value = '';
    document.getElementById('returnNote').value = '';
}

function updateCheckoutStock() {
    const id = parseInt(document.getElementById('checkoutPart').value);
    if (!id) {
        document.getElementById('checkoutStockInfo').textContent = '';
        return;
    }
    const p = data.parts.find(x => x.id === id);
    if (p) {
        const isLow = p.stock <= p.alertStock;
        document.getElementById('checkoutStockInfo').innerHTML = `当前库存：<strong style="color:${isLow?'var(--red)':'var(--green)'}">${p.stock}</strong> 件`;
        document.getElementById('checkoutQty').textContent = '1';
        document.getElementById('checkoutQty').dataset.max = p.stock;
    }
}

function updateReturnList() {
    const id = parseInt(document.getElementById('returnPart').value);
    document.getElementById('returnQty').textContent = '1';
    if (!id) return;
}

function changeQty(id, delta) {
    const el = document.getElementById(id);
    let val = parseInt(el.textContent);
    const max = parseInt(el.dataset.max) || 999;
    val = Math.max(1, Math.min(max, val + delta));
    el.textContent = val;
}

function doCheckout() {
    const partId = parseInt(document.getElementById('checkoutPart').value);
    const personId = parseInt(document.getElementById('checkoutPerson').value);
    const qty = parseInt(document.getElementById('checkoutQty').textContent);
    const note = document.getElementById('checkoutNote').value.trim();
    
    if (!partId) return alert('请选择配件');
    if (!personId) return alert('请选择领取人');
    
    const p = data.parts.find(x => x.id === partId);
    if (p.stock < qty) return alert('库存不足！当前库存：' + p.stock);
    
    p.stock -= qty;
    const record = {
        id: Date.now(),
        partId,
        partName: p.name,
        personId,
        qty,
        type: 'out',
        time: new Date().toISOString(),
        note
    };
    data.records.push(record);
    save();
    
    alert(`✅ 领用成功！\n${p.name} × ${qty}件\n领取人：${getPersonName(personId)}`);
    initCheckout();
    switchTab('home');
}

function doReturn() {
    const partId = parseInt(document.getElementById('returnPart').value);
    const personId = parseInt(document.getElementById('returnPerson').value);
    const qty = parseInt(document.getElementById('returnQty').textContent);
    const note = document.getElementById('returnNote').value.trim();
    
    if (!partId) return alert('请选择配件');
    if (!personId) return alert('请选择归还人');
    
    const p = data.parts.find(x => x.id === partId);
    p.stock += qty;
    const record = {
        id: Date.now(),
        partId,
        partName: p.name,
        personId,
        qty,
        type: 'ret',
        time: new Date().toISOString(),
        note
    };
    data.records.push(record);
    save();
    
    alert(`✅ 归还成功！\n${p.name} × ${qty}件\n归还人：${getPersonName(personId)}`);
    initCheckout();
    switchTab('home');
}

// ==================== 记录列表 ====================
function loadRecords() {
    const type = document.getElementById('filterType').value;
    const personId = parseInt(document.getElementById('filterPerson').value) || 0;
    const date = document.getElementById('filterDate').value;
    
    // 填充人员筛选
    const personFilter = document.getElementById('filterPerson');
    if (!personFilter.querySelector('option[value=""]')) {
        personFilter.innerHTML = '<option value="">全部人员</option>' + 
            data.persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }
    
    let records = [...data.records].reverse();
    if (type) records = records.filter(r => r.type === type);
    if (personId) records = records.filter(r => r.personId === personId);
    if (date) records = records.filter(r => r.time.startsWith(date));
    
    if (records.length === 0) {
        document.getElementById('recordsList').innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">暂无记录</div></div>';
        return;
    }
    
    document.getElementById('recordsList').innerHTML = records.map(r => `
        <div class="record-item ${r.type}">
            <div class="record-header">
                <div class="record-title">${r.partName}</div>
                <span class="record-badge badge-${r.type}">${r.type === 'out' ? '领用' : '归还'}</span>
            </div>
            <div class="record-meta">
                <span>👤 ${getPersonName(r.personId)}</span>
                <span>📦 ${r.type === 'out' ? '-' : '+'}${r.qty}件</span>
                <span>⏰ ${formatDate(r.time)}</span>
            </div>
            ${r.note ? `<div style="font-size:12px;color:var(--muted);margin-top:4px;">📝 ${r.note}</div>` : ''}
        </div>
    `).join('');
}

// ==================== 设置 ====================
function showModal(id) {
    document.getElementById(id).classList.add('active');
    if (id === 'settingsModal') renderSettings();
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

function renderSettings() {
    // 人员列表
    document.getElementById('personList').innerHTML = data.persons.map(p => `
        <div class="list-item">
            <div class="list-item-info">
                <div class="list-item-name">${p.name}</div>
                <div class="list-item-meta">${p.role === 'driver' ? '司机' : p.role === 'worker' ? '工人' : '其他'}${p.phone ? ' · ' + p.phone : ''}</div>
            </div>
            <div style="display:flex;gap:8px;">
                <span class="list-item-action" onclick="editPerson(${p.id})">✏️</span>
                <span class="list-item-action" style="color:var(--red)" onclick="deletePerson(${p.id})">🗑️</span>
            </div>
        </div>
    `).join('');
    
    // 分类列表
    document.getElementById('categoryList').innerHTML = data.categories.map(c => `
        <div class="list-item">
            <div class="list-item-info">
                <div class="list-item-name">${getCategoryIcon(c.id)} ${c.name}</div>
            </div>
            <span class="list-item-action" style="color:var(--red)" onclick="deleteCategory(${c.id})">🗑️</span>
        </div>
    `).join('');
    
    // 配件管理
    document.getElementById('allPartsManage').innerHTML = data.parts.map(p => `
        <div class="list-item">
            <div class="list-item-info">
                <div class="list-item-name">${p.name}${p.model ? ' ('+p.model+')' : ''}</div>
                <div class="list-item-meta">${getCategoryName(p.categoryId)} · 库存 ${p.stock}</div>
            </div>
            <div style="display:flex;gap:8px;">
                <span class="list-item-action" onclick="editPart(${p.id})">✏️</span>
                <span class="list-item-action" style="color:var(--red)" onclick="deletePart(${p.id})">🗑️</span>
            </div>
        </div>
    `).join('');
    
    // 填充分类下拉
    document.getElementById('partCategoryInput').innerHTML = data.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

function showAddPerson() {
    document.getElementById('editPersonId').value = '';
    document.getElementById('personNameInput').value = '';
    document.getElementById('personPhoneInput').value = '';
    document.getElementById('personRoleInput').value = 'driver';
    showModal('addPersonModal');
}

function editPerson(id) {
    const p = data.persons.find(x => x.id === id);
    if (!p) return;
    document.getElementById('editPersonId').value = id;
    document.getElementById('personNameInput').value = p.name;
    document.getElementById('personPhoneInput').value = p.phone || '';
    document.getElementById('personRoleInput').value = p.role || 'driver';
    showModal('addPersonModal');
}

function savePerson() {
    const name = document.getElementById('personNameInput').value.trim();
    const phone = document.getElementById('personPhoneInput').value.trim();
    const role = document.getElementById('personRoleInput').value;
    const editId = document.getElementById('editPersonId').value;
    
    if (!name) return alert('请输入姓名');
    
    if (editId) {
        const p = data.persons.find(x => x.id === parseInt(editId));
        p.name = name;
        p.phone = phone;
        p.role = role;
    } else {
        data.persons.push({
            id: data.nextPersonId++,
            name, phone, role
        });
    }
    save();
    closeModal('addPersonModal');
    renderSettings();
}

function deletePerson(id) {
    if (!confirm('确定删除该人员？')) return;
    data.persons = data.persons.filter(x => x.id !== id);
    save();
    renderSettings();
}

function addCategory() {
    const name = document.getElementById('newCategoryInput').value.trim();
    if (!name) return;
    data.categories.push({ id: data.nextCategoryId++, name });
    save();
    document.getElementById('newCategoryInput').value = '';
    renderSettings();
}

function deleteCategory(id) {
    const hasParts = data.parts.some(p => p.categoryId === id);
    if (hasParts) return alert('该分类下有配件，无法删除');
    if (!confirm('确定删除该分类？')) return;
    data.categories = data.categories.filter(x => x.id !== id);
    save();
    renderSettings();
}

function showAddPart() {
    document.getElementById('editPartId').value = '';
    document.getElementById('addPartTitle').textContent = '➕ 添加配件';
    document.getElementById('partNameInput').value = '';
    document.getElementById('partModelInput').value = '';
    document.getElementById('partStockInput').value = '0';
    document.getElementById('partAlertInput').value = '5';
    document.getElementById('partNoteInput').value = '';
    document.getElementById('partCategoryInput').value = data.categories[0]?.id || 1;
    showModal('addPartModal');
}

function editPart(id) {
    const p = data.parts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('editPartId').value = id;
    document.getElementById('addPartTitle').textContent = '✏️ 编辑配件';
    document.getElementById('partNameInput').value = p.name;
    document.getElementById('partModelInput').value = p.model || '';
    document.getElementById('partStockInput').value = p.stock;
    document.getElementById('partAlertInput').value = p.alertStock;
    document.getElementById('partNoteInput').value = p.note || '';
    document.getElementById('partCategoryInput').value = p.categoryId;
    showModal('addPartModal');
}

function savePart() {
    const name = document.getElementById('partNameInput').value.trim();
    const model = document.getElementById('partModelInput').value.trim();
    const stock = parseInt(document.getElementById('partStockInput').value) || 0;
    const alertStock = parseInt(document.getElementById('partAlertInput').value) || 5;
    const categoryId = parseInt(document.getElementById('partCategoryInput').value) || 1;
    const note = document.getElementById('partNoteInput').value.trim();
    const editId = document.getElementById('editPartId').value;
    
    if (!name) return alert('请输入配件名称');
    
    if (editId) {
        const p = data.parts.find(x => x.id === parseInt(editId));
        p.name = name;
        p.model = model;
        p.stock = stock;
        p.alertStock = alertStock;
        p.categoryId = categoryId;
        p.note = note;
    } else {
        data.parts.push({
            id: data.nextPartId++,
            name, model, stock, alertStock, categoryId, note, history: []
        });
    }
    save();
    closeModal('addPartModal');
    renderSettings();
}

function deletePart(id) {
    if (!confirm('确定删除该配件？')) return;
    data.parts = data.parts.filter(x => x.id !== id);
    save();
    renderSettings();
}

// ==================== 数据导入导出 ====================
function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `仓库数据_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    alert('数据已导出');
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (imported.parts && imported.persons) {
                    data = imported;
                    save();
                    alert('数据导入成功！');
                    closeModal('settingsModal');
                    renderHome();
                } else {
                    alert('文件格式不正确');
                }
            } catch(e) {
                alert('导入失败：' + e.message);
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

// ==================== 启动 ====================
document.addEventListener('DOMContentLoaded', () => {
    // 填充filterPerson
    loadRecords();
    renderHome();
    
    // 点击空白关闭弹窗
    document.querySelectorAll('.modal-overlay').forEach(m => {
        m.addEventListener('click', e => {
            if (e.target === m) m.classList.remove('active');
        });
    });
});

const var_green = 'var(--green)';
