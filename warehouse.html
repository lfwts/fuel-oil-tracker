<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓库管理系统</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#F3F4F6',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        dark: '#1F2937',
                        medium: '#6B7280'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .glass-effect {
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
            .tab-active {
                @apply text-primary border-b-2 border-primary;
            }
            .btn-primary {
                @apply bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors;
            }
            .btn-secondary {
                @apply bg-secondary text-dark px-4 py-2 rounded-lg hover:bg-gray-200 transition-colors;
            }
            .btn-success {
                @apply bg-success text-white px-4 py-2 rounded-lg hover:bg-green-600 transition-colors;
            }
            .btn-warning {
                @apply bg-warning text-white px-4 py-2 rounded-lg hover:bg-amber-600 transition-colors;
            }
            .btn-danger {
                @apply bg-danger text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-colors;
            }
            .card {
                @apply bg-white rounded-xl shadow-md p-4 mb-4;
            }
            .input-field {
                @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent;
            }
            .badge {
                @apply px-2 py-1 text-xs rounded-full;
            }
            .badge-success {
                @apply bg-green-100 text-green-800;
            }
            .badge-warning {
                @apply bg-yellow-100 text-yellow-800;
            }
            .badge-danger {
                @apply bg-red-100 text-red-800;
            }
        }
    </style>
</head>
<body class="bg-secondary min-h-screen font-sans text-dark">
    <!-- 顶部导航栏 -->
    <header class="glass-effect sticky top-0 z-50 border-b border-gray-200">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-primary">仓库管理系统</h1>
            <div class="flex items-center space-x-3">
                <button id="searchBtn" class="p-2 rounded-full hover:bg-gray-200">
                    <i class="fa fa-search text-medium"></i>
                </button>
                <button id="settingsBtn" class="p-2 rounded-full hover:bg-gray-200">
                    <i class="fa fa-cog text-medium"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="container mx-auto px-4 py-4 pb-20">
        <!-- 页面内容将通过JavaScript动态加载 -->
        <div id="pageContent">
            <!-- 默认显示仪表盘页面 -->
        </div>
    </main>

    <!-- 底部导航栏 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50">
        <div class="flex justify-around">
            <button class="nav-btn flex flex-col items-center py-3 px-5 tab-active" data-page="dashboard">
                <i class="fa fa-home text-lg"></i>
                <span class="text-xs mt-1">首页</span>
            </button>
            <button class="nav-btn flex flex-col items-center py-3 px-5" data-page="parts">
                <i class="fa fa-cubes text-lg"></i>
                <span class="text-xs mt-1">配件</span>
            </button>
            <button class="nav-btn flex flex-col items-center py-3 px-5" data-page="checkout">
                <i class="fa fa-sign-out text-lg"></i>
                <span class="text-xs mt-1">领用</span>
            </button>
            <button class="nav-btn flex flex-col items-center py-3 px-5" data-page="return">
                <i class="fa fa-sign-in text-lg"></i>
                <span class="text-xs mt-1">归还</span>
            </button>
            <button class="nav-btn flex flex-col items-center py-3 px-5" data-page="records">
                <i class="fa fa-list-alt text-lg"></i>
                <span class="text-xs mt-1">记录</span>
            </button>
        </div>
    </nav>

    <!-- 搜索模态框 -->
    <div id="searchModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-start justify-center pt-20">
        <div class="bg-white rounded-xl w-full max-w-md mx-4 p-4">
            <div class="flex items-center mb-4">
                <i class="fa fa-search text-medium mr-3"></i>
                <input type="text" id="searchInput" placeholder="搜索配件名称、型号..." class="input-field">
                <button id="closeSearchBtn" class="ml-2 p-2">
                    <i class="fa fa-times text-medium"></i>
                </button>
            </div>
            <div id="searchResults" class="max-h-96 overflow-y-auto">
                <!-- 搜索结果将在这里显示 -->
            </div>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-start justify-center pt-20">
        <div class="bg-white rounded-xl w-full max-w-md mx-4 p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">设置</h2>
                <button id="closeSettingsBtn" class="p-2">
                    <i class="fa fa-times text-medium"></i>
                </button>
            </div>
            <div class="space-y-4">
                <button id="manageMastersBtn" class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 flex justify-between items-center">
                    <span>师傅管理</span>
                    <i class="fa fa-chevron-right text-medium"></i>
                </button>
                <button id="manageCategoriesBtn" class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 flex justify-between items-center">
                    <span>分类管理</span>
                    <i class="fa fa-chevron-right text-medium"></i>
                </button>
                <button id="exportDataBtn" class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 flex justify-between items-center">
                    <span>导出数据</span>
                    <i class="fa fa-download text-medium"></i>
                </button>
                <button id="importDataBtn" class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 flex justify-between items-center">
                    <span>导入数据</span>
                    <i class="fa fa-upload text-medium"></i>
                </button>
                <button id="resetDataBtn" class="w-full text-left px-4 py-3 rounded-lg hover:bg-gray-100 flex justify-between items-center text-danger">
                    <span>重置数据</span>
                    <i class="fa fa-refresh text-medium"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 师傅管理模态框 -->
    <div id="mastersModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-start justify-center pt-20">
        <div class="bg-white rounded-xl w-full max-w-md mx-4 p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">师傅管理</h2>
                <button id="closeMastersBtn" class="p-2">
                    <i class="fa fa-times text-medium"></i>
                </button>
            </div>
            <div id="mastersList" class="space-y-3 mb-4">
                <!-- 师傅列表将在这里显示 -->
            </div>
            <button id="addMasterBtn" class="btn-primary w-full flex justify-center items-center">
                <i class="fa fa-plus mr-2"></i> 添加师傅
            </button>
        </div>
    </div>

    <!-- 添加/编辑师傅模态框 -->
    <div id="editMasterModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-start justify-center pt-20">
        <div class="bg-white rounded-xl w-full max-w-md mx-4 p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 id="editMasterTitle" class="text-lg font-bold">添加师傅</h2>
                <button id="closeEditMasterBtn" class="p-2">
                    <i class="fa fa-times text-medium"></i>
                </button>
            </div>
            <form id="editMasterForm" class="space-y-4">
                <input type="hidden" id="masterId">
                <div>
                    <label for="masterName" class="block text-sm font-medium mb-1">姓名</label>
                    <input type="text" id="masterName" class="input-field" required>
                </div>
                <div>
                    <label for="masterPhone" class="block text-sm font-medium mb-1">电话</label>
                    <input type="tel" id="masterPhone" class="input-field">
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="cancelEditMasterBtn" class="btn-secondary">取消</button>
                    <button type="submit" class="btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 分类管理模态框 -->
    <div id="categoriesModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-start justify-center pt-20">
        <div class="bg-white rounded-xl w-full max-w-md mx-4 p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">分类管理</h2>
                <button id="closeCategoriesBtn" class="p-2">
                    <i class="fa fa-times text-medium"></i>
                </button>
            </div>
            <div id="categoriesList" class="space-y-3 mb-4">
                <!-- 分类列表将在这里显示 -->
            </div>
            <div class="flex">
                <input type="text" id="newCategoryInput" placeholder="新分类名称" class="input-field flex-1 mr-2">
                <button id="addCategoryBtn" class="btn-primary whitespace-nowrap">
                    <i class="fa fa-plus mr-1"></i> 添加
                </button>
            </div>
        </div>
    </div>

    <!-- 添加/编辑配件模态框 -->
    <div id="editPartModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-start justify-center pt-5">
        <div class="bg-white rounded-xl w-full max-w-md mx-4 p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 id="editPartTitle" class="text-lg font-bold">添加配件</h2>
                <button id="closeEditPartBtn" class="p-2">
                    <i class="fa fa-times text-medium"></i>
                </button>
            </div>
            <form id="editPartForm" class="space-y-4">
                <input type="hidden" id="partId">
                <div>
                    <label for="partName" class="block text-sm font-medium mb-1">配件名称 <span class="text-danger">*</span></label>
                    <input type="text" id="partName" class="input-field" required>
                </div>
                <div>
                    <label for="partModel" class="block text-sm font-medium mb-1">型号规格</label>
                    <input type="text" id="partModel" class="input-field">
                </div>
                <div>
                    <label for="partCategory" class="block text-sm font-medium mb-1">分类</label>
                    <select id="partCategory" class="input-field">
                        <!-- 分类选项将在这里动态添加 -->
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="partTotalQuantity" class="block text-sm font-medium mb-1">总数量 <span class="text-danger">*</span></label>
                        <input type="number" id="partTotalQuantity" class="input-field" min="0" required>
                    </div>
                    <div>
                        <label for="partUnit" class="block text-sm font-medium mb-1">单位</label>
                        <input type="text" id="partUnit" class="input-field" value="个">
                    </div>
                </div>
                <div>
                    <label for="partMinStock" class="block text-sm font-medium mb-1">最小库存警告</label>
                    <input type="number" id="partMinStock" class="input-field" min="0" value="1">
                </div>
                <div>
                    <label for="partBarcode" class="block text-sm font-medium mb-1">条码</label>
                    <div class="flex">
                        <input type="text" id="partBarcode" class="input-field flex-1 mr-2">
                        <button type="button" id="scanBarcodeBtn" class="btn-secondary whitespace-nowrap">
                            <i class="fa fa-qrcode mr-1"></i> 扫描
                        </button>
                    </div>
                </div>
                <div>
                    <label for="partNotes" class="block text-sm font-medium mb-1">备注</label>
                    <textarea id="partNotes" class="input-field" rows="3"></textarea>
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="cancelEditPartBtn" class="btn-secondary">取消</button>
                    <button type="submit" class="btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 领用配件模态框 -->
    <div id="checkoutModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-start justify-center pt-5">
        <div class="bg-white rounded-xl w-full max-w-md mx-4 p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">领用配件</h2>
                <button id="closeCheckoutBtn" class="p-2">
                    <i class="fa fa-times text-medium"></i>
                </button>
            </div>
            <form id="checkoutForm" class="space-y-4">
                <div>
                    <label for="checkoutMaster" class="block text-sm font-medium mb-1">选择师傅 <span class="text-danger">*</span></label>
                    <select id="checkoutMaster" class="input-field" required>
                        <!-- 师傅选项将在这里动态添加 -->
                    </select>
                </div>
                <div>
                    <label for="checkoutPart" class="block text-sm font-medium mb-1">选择配件 <span class="text-danger">*</span></label>
                    <div class="flex">
                        <select id="checkoutPart" class="input-field flex-1 mr-2" required>
                            <!-- 配件选项将在这里动态添加 -->
                        </select>
                        <button type="button" id="scanPartBtn" class="btn-secondary whitespace-nowrap">
                            <i class="fa fa-qrcode mr-1"></i> 扫描
                        </button>
                    </div>
                </div>
                <div>
                    <label for="checkoutQuantity" class="block text-sm font-medium mb-1">领用数量 <span class="text-danger">*</span></label>
                    <input type="number" id="checkoutQuantity" class="input-field" min="1" value="1" required>
                </div>
                <div>
                    <label for="checkoutPurpose" class="block text-sm font-medium mb-1">用途/客户信息</label>
                    <input type="text" id="checkoutPurpose" class="input-field" placeholder="例如：客户名称或维修项目">
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="cancelCheckoutBtn" class="btn-secondary">取消</button>
                    <button type="submit" class="btn-primary">确认领用</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 归还配件模态框 -->
    <div id="returnModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-start justify-center pt-5">
        <div class="bg-white rounded-xl w-full max-w-md mx-4 p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">归还配件</h2>
                <button id="closeReturnBtn" class="p-2">
                    <i class="fa fa-times text-medium"></i>
                </button>
            </div>
            <form id="returnForm" class="space-y-4">
                <input type="hidden" id="recordId">
                <input type="hidden" id="originalQuantity">
                <div class="card">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 id="returnPartName" class="font-bold"></h3>
                            <p id="returnPartModel" class="text-sm text-medium"></p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-medium">共领用</p>
                            <span id="returnQuantity" class="text-lg font-bold"></span>
                        </div>
                    </div>
                    <div class="mt-2 text-sm">
                        <p><span class="text-medium">领用师傅：</span><span id="returnMasterName"></span></p>
                        <p><span class="text-medium">领用时间：</span><span id="returnCheckoutTime"></span></p>
                        <p><span class="text-medium">用途：</span><span id="returnPurpose"></span></p>
                    </div>
                </div>
                <div>
                    <label for="returnQuantityInput" class="block text-sm font-medium mb-1">归还数量 <span class="text-danger">*</span></label>
                    <div class="flex items-center">
                        <button type="button" id="decreaseQuantity" class="w-10 h-10 bg-gray-100 rounded-l-lg flex items-center justify-center hover:bg-gray-200">
                            <i class="fa fa-minus"></i>
                        </button>
                        <input type="number" id="returnQuantityInput" class="input-field text-center mx-0 border-l-0 border-r-0 rounded-none" min="1" value="1" required>
                        <button type="button" id="increaseQuantity" class="w-10 h-10 bg-gray-100 rounded-r-lg flex items-center justify-center hover:bg-gray-200">
                            <i class="fa fa-plus"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">归还状态 <span class="text-danger">*</span></label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="flex flex-col items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="radio" name="returnCondition" value="good" class="sr-only" checked>
                            <div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center mb-1 return-radio">
                                <div class="w-3 h-3 rounded-full bg-primary hidden return-radio-dot"></div>
                            </div>
                            <span class="text-sm">完好</span>
                        </label>
                        <label class="flex flex-col items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="radio" name="returnCondition" value="damaged" class="sr-only">
                            <div class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center mb-1 return-radio">
                                <div class="w-3 h-3 rounded-full bg-primary hidden return-radio-dot"></div>
                            </div>
                            <span class="text-sm">损坏</span>
                        </label>
                        <label class="flex flex-col items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="radio" name="returnCondition" value="lost" class="sr-only">
                            <div class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center mb-1 return-radio">
                                <div class="w-3 h-3 rounded-full bg-primary hidden return-radio-dot"></div>
                            </div>
                            <span class="text-sm">丢失</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label for="returnNotes" class="block text-sm font-medium mb-1">备注</label>
                    <textarea id="returnNotes" class="input-field" rows="2" placeholder="例如：损坏原因或其他说明"></textarea>
                </div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" id="cancelReturnBtn" class="btn-secondary">取消</button>
                    <button type="submit" class="btn-primary">确认归还</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 扫码模态框 -->
    <div id="scanModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
        <div class="flex justify-between items-center p-4 bg-black text-white">
            <button id="closeScanBtn" class="p-2">
                <i class="fa fa-times text-xl"></i>
            </button>
            <h2 class="text-lg font-bold">扫描条码</h2>
            <button id="switchCameraBtn" class="p-2">
                <i class="fa fa-refresh text-xl"></i>
            </button>
        </div>
        <div class="flex-1 flex items-center justify-center">
            <video id="scanVideo" class="w-full h-full object-cover"></video>
            <div id="scanOverlay" class="absolute inset-0 flex items-center justify-center">
                <div class="w-64 h-64 border-4 border-white relative">
                    <div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-white -mt-2 -ml-2"></div>
                    <div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-white -mt-2 -mr-2"></div>
                    <div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-white -mb-2 -ml-2"></div>
                    <div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-white -mb-2 -mr-2"></div>
                </div>
            </div>
        </div>
        <div class="bg-black text-white p-4 text-center">
            <p>将条码/二维码对准扫描区域</p>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl w-full max-w-xs mx-4 p-4">
            <h3 id="confirmTitle" class="text-lg font-bold text-center mb-3">确认操作</h3>
            <p id="confirmMessage" class="text-center mb-6">您确定要执行此操作吗？</p>
            <div class="flex justify-center space-x-3">
                <button id="cancelConfirmBtn" class="btn-secondary">取消</button>
                <button id="acceptConfirmBtn" class="btn-danger">确认</button>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-dark text-white px-4 py-2 rounded-lg shadow-lg z-50 hidden">
        <span id="toastMessage"></span>
    </div>

    <script>
        // 初始化数据
        const initData = () => {
            // 检查是否已有数据
            // 为了更新数据，暂时注释掉这行，强制重新初始化
            // if (localStorage.getItem('warehouseData')) {
            //     return;
            // }
            // 清除旧数据
            localStorage.removeItem('warehouseData');

            // 初始化师傅数据
            const masters = [
                { id: 'm1', name: '莫哥', phone: '', avatar: '' },
                { id: 'm2', name: '李吟', phone: '', avatar: '' },
                { id: 'm3', name: '王琼', phone: '', avatar: '' },
                { id: 'm4', name: '光福', phone: '', avatar: '' }
            ];

            // 初始化分类数据
            const categories = [
                { id: 'c1', name: '油泵油嘴' },
                { id: 'c2', name: '风机' },
                { id: 'c3', name: '点火配件' },
                { id: 'c4', name: '胶带' },
                { id: 'c5', name: '其他配件' }
            ];

            // 初始化配件数据
            const parts = [
                // 油泵和油嘴
                { 
                    id: 'p1', 
                    name: '油泵', 
                    model: '', 
                    category: 'c1', 
                    totalQuantity: 30,

        // 获取数据
        const getData = () => {
            const data = localStorage.getItem('warehouseData');
            return data ? JSON.parse(data) : {
                masters: [],

                records: [],
                lastUpdated: new Date().toISOString()
            };
        };

        const saveData = (data) => {
            data.lastUpdated = new Date().toISOString();
            localStorage.setItem('warehouseData', JSON.stringify(data));
        };

        // 生成唯一ID
        const generateId = (prefix) => {
            return `${prefix}${Date.now()}${Math.floor(Math.random() * 1000)}`;
        };

        // 显示提示消息
        const showToast = (message, duration = 3000) => {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, duration);
        };

        // 显示确认对话框
        const showConfirm = (title, message, onConfirm) => {
            const confirmModal = document.getElementById('confirmModal');
            const confirmTitle = document.getElementById('confirmTitle');
            const confirmMessage = document.getElementById('confirmMessage');
            const acceptConfirmBtn = document.getElementById('acceptConfirmBtn');
            const cancelConfirmBtn = document.getElementById('cancelConfirmBtn');
            
            confirmTitle.textContent = title;
            confirmMessage.textContent = message;
            confirmModal.classList.remove('hidden');
            
            const handleAccept = () => {
                onConfirm();
                confirmModal.classList.add('hidden');
                acceptConfirmBtn.removeEventListener('click', handleAccept);
                cancelConfirmBtn.removeEventListener('click', handleCancel);
            };
            
            const handleCancel = () => {
                confirmModal.classList.add('hidden');
                acceptConfirmBtn.removeEventListener('click', handleAccept);
                cancelConfirmBtn.removeEventListener('click', handleCancel);
            };
            
            acceptConfirmBtn.addEventListener('click', handleAccept);
            cancelConfirmBtn.addEventListener('click', handleCancel);
        };

        // 格式化日期时间
        const formatDateTime = (dateString) => {
            if (!dateString) return '';
            
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            
            return `${year}-${month}-${day} ${hours}:${minutes}`;
        };

        // 获取状态标签
        const getStatusBadge = (status) => {
            switch (status) {
                case 'good':
                    return '<span class="badge badge-success">完好</span>';
                case 'damaged':
                    return '<span class="badge badge-warning">损坏</span>';
                case 'lost':
                    return '<span class="badge badge-danger">丢失</span>';
                default:
                    return '';

        };

        const getStockStatus = (part) => {
            if (part.availableQuantity === 0) {
                return { class: 'text-danger', icon: 'fa-exclamation-circle', text: '缺货' };
            } else if (part.availableQuantity <= part.minStock) {
                return { class: 'text-warning', icon: 'fa-exclamation-triangle', text: '库存低' };

                return { class: 'text-success', icon: 'fa-check-circle', text: '充足' };

                    this.saveMaster();

                    const query = document.getElementById('searchInput').value.toLowerCase().trim();
                    this.searchParts(query);
                });
            }

            bindQuantityEvents() {
                // 增加数量按钮
                document.getElementById('increaseQuantity').addEventListener('click', () => {
                    const input = document.getElementById('returnQuantityInput');
                    const currentValue = parseInt(input.value);
                    const maxValue = parseInt(input.max);
                    
                    if (currentValue < maxValue) {
                        input.value = currentValue + 1;
                    }
                });
                
                // 减少数量按钮
                document.getElementById('decreaseQuantity').addEventListener('click', () => {
                    const input = document.getElementById('returnQuantityInput');
                    const currentValue = parseInt(input.value);
                    
                    if (currentValue > 1) {
                        input.value = currentValue - 1;
                    }
                });
                
                // 输入框变化事件
                document.getElementById('returnQuantityInput').addEventListener('change', () => {
                    const input = document.getElementById('returnQuantityInput');
                    let value = parseInt(input.value);
                    const maxValue = parseInt(input.max);
                    
                    if (isNaN(value) || value < 1) {
                        value = 1;
                    } else if (value > maxValue) {
                        value = maxValue;
                    }
                    
                    input.value = value;
                });
            }
            
            bindOtherEvents() {
                // 导出数据
                document.getElementById('exportDataBtn').addEventListener('click', () => {
                    this.exportData();
                });
                
                // 导入数据
                document.getElementById('importDataBtn').addEventListener('click', () => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json';
                    input.onchange = (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                try {
                                    const data = JSON.parse(e.target.result);
                                    this.importData(data);
                                } catch (error) {
                                    showToast('导入失败：无效的数据格式');
                                }
                            };
                            reader.readAsText(file);
                        }
                    };
                    input.click();
                });

                document.getElementById('resetDataBtn').addEventListener('click', () => {

                        '重置数据',

            filterParts() {
                const data = getData();
                const parts = data.parts;
                const categoryFilter = document.getElementById('categoryFilter').value;
                const stockFilter = document.getElementById('stockFilter').value;
                
                let filteredParts = parts;
                
                // 按分类筛选
                if (categoryFilter) {
                    filteredParts = filteredParts.filter(part => part.category === categoryFilter);
                }
                
                // 按库存状态筛选
                if (stockFilter === 'available') {
                    filteredParts = filteredParts.filter(part => part.availableQuantity > 0);
                } else if (stockFilter === 'low') {
                    filteredParts = filteredParts.filter(part => part.availableQuantity <= part.minStock && part.availableQuantity > 0);
                } else if (stockFilter === 'out') {
                    filteredParts = filteredParts.filter(part => part.availableQuantity === 0);
                }
                
                // 渲染配件列表
                const partsList = document.getElementById('partsList');
                partsList.innerHTML = '';
                
                if (filteredParts.length === 0) {
                    partsList.innerHTML = `
                        <div class="py-12 text-center text-medium">
                            <i class="fa fa-cubes text-4xl mb-3"></i>
                            <p>没有找到符合条件的配件</p>
                        </div>
                    `;
                    return;
                }
                
                filteredParts.forEach(part => {
                    const category = data.categories.find(c => c.id === part.category);
                    const stockStatus = getStockStatus(part);
                    
                    const partElement = document.createElement('div');
                    partElement.className = 'card';
                    partElement.innerHTML = `

            deletePart(partId) {
                const data = getData();
                const part = data.parts.find(p => p.id === partId);
                
                if (part) {
                    // 检查是否有未归还的记录
                    const activeRecords = data.records.filter(r => r.partId === partId && r.status === 'checkout');
                    
                    if (activeRecords.length > 0) {
                        showToast('无法删除：该配件有未归还的领用记录');
                        return;
                    }
                    
                    showConfirm(
                        '删除配件',
                        `确定要删除配件"${part.name}"吗？此操作无法撤销。`,
                        () => {
                            data.parts = data.parts.filter(p => p.id !== partId);
                            saveData(data);
                            this.filterParts();
                            showToast('配件已删除');
                        }
                    );
                }
            }

            savePart() {
                const partId = document.getElementById('partId').value;
                const name = document.getElementById('partName').value.trim();
                const model = document.getElementById('partModel').value.trim();
                const category = document.getElementById('partCategory').value;
                const totalQuantity = parseInt(document.getElementById('partTotalQuantity').value);
                const unit = document.getElementById('partUnit').value.trim() || '个';
                const minStock = parseInt(document.getElementById('partMinStock').value) || 1;
                const barcode = document.getElementById('partBarcode').value.trim();
                const notes = document.getElementById('partNotes').value.trim();
                
                if (!name) {
                    showToast('请输入配件名称');
                    return;
                }
                
                if (isNaN(totalQuantity) || totalQuantity < 0) {
                    showToast('请输入有效的数量');
                    return;
                }
                
                const data = getData();
                
                if (partId) {
                    // 编辑现有配件
                    const partIndex = data.parts.findIndex(p => p.id === partId);
                    
                    if (partIndex !== -1) {
                        const oldPart = data.parts[partIndex];
                        const availableDiff = totalQuantity - oldPart.totalQuantity;
                        
                        data.parts[partIndex] = {
                            ...oldPart,
                            name,
                            model,
                            category,
                            totalQuantity,
                            availableQuantity: oldPart.availableQuantity + availableDiff,
                            unit,
                            minStock,
                            barcode,
                            notes
                        };
                        
                        saveData(data);
                        document.getElementById('editPartModal').classList.add('hidden');
                        this.filterParts();
                        showToast('配件已更新');
                    }
                } else {
                    // 添加新配件
                    const newPart = {
                        id: generateId('p'),
                        name,
                        model,
                        category,
                        totalQuantity,
                        availableQuantity: totalQuantity,
                        unit,
                        minStock,
                        barcode,
                        image: '',
                        notes
                    };
                    
                    data.parts.push(newPart);
                    saveData(data);
                    document.getElementById('editPartModal').classList.add('hidden');
                    this.filterParts();
                    showToast('配件已添加');
                }
            }

            processCheckout(masterId, partId, quantity, purpose) {
                if (!masterId) {
                    showToast('请选择师傅');
                    return;
                }
                
                if (!partId) {
                    showToast('请选择配件');
                    return;
                }
                
                if (isNaN(quantity) || quantity < 1) {
                    showToast('请输入有效的数量');
                    return;
                }
                
                const data = getData();
                const part = data.parts.find(p => p.id === partId);
                
                if (!part) {
                    showToast('配件不存在');
                    return;
                }
                
                if (part.availableQuantity < quantity) {
                    showToast(`库存不足：当前仅有 ${part.availableQuantity} ${part.unit}`);
                    return;
                }
                
                // 创建领用记录
                const newRecord = {
                    id: generateId('r'),
                    partId,
                    masterId,
                    quantity,
                    purpose: purpose || '未指定',
                    checkoutTime: new Date().toISOString(),
                    returnTime: null,
                    status: 'checkout',
                    condition: null
                };
                
                // 更新配件库存
                part.availableQuantity -= quantity;
                
                // 保存数据
                data.records.push(newRecord);
                saveData(data);
                
                // 重置表单
                document.getElementById('quickCheckoutQuantity').value = '1';
                document.getElementById('quickCheckoutPurpose').value = '';
                
                // 更新页面
                this.updatePartSelect('quickCheckoutPart', data);
                this.loadRecentCheckouts();
                
                showToast('领用成功');
            }

                const recordId = document.getElementById('recordId').value;
                const returnQuantity = parseInt(document.getElementById('returnQuantityInput').value);
                const condition = document.querySelector('input[name="returnCondition"]:checked').value;
                const notes = document.getElementById('returnNotes').value.trim();
                
                const data = getData();
                const recordIndex = data.records.findIndex(r => r.id === recordId);
                
                if (recordIndex !== -1) {
                    const record = data.records[recordIndex];
                    const part = data.parts.find(p => p.id === record.partId);
                    
                    if (part) {
                        // 验证归还数量
                        if (returnQuantity > record.quantity) {
                            showToast('归还数量不能大于领用数量');
                            return;
                        }
                        
                        if (returnQuantity === record.quantity) {
                            // 全部归还，更新原记录
                            data.records[recordIndex] = {
                                ...record,
                                returnTime: new Date().toISOString(),
                                status: 'returned',
                                condition,
                                notes
                            };
                        } else {
                            // 部分归还，创建新的归还记录
                            const returnRecord = {
                                id: generateId('r'),
                                partId: record.partId,
                                masterId: record.masterId,
                                quantity: returnQuantity,
                                purpose: record.purpose,
                                checkoutTime: record.checkoutTime,
                                returnTime: new Date().toISOString(),
                                status: 'returned',
                                condition,
                                notes: notes || record.notes
                            };
                            
                            // 更新原记录的数量
                            data.records[recordIndex] = {
                                ...record,
                                quantity: record.quantity - returnQuantity
                            };
                            
                            // 添加归还记录
                            data.records.push(returnRecord);
                        }
                        
                        // 更新库存
                        if (condition === 'good') {
                            part.availableQuantity += returnQuantity;
                        } else if (condition === 'damaged') {
                            // 损坏的配件不返回库存
                            part.totalQuantity -= returnQuantity;
                        } else if (condition === 'lost') {
                            // 丢失的配件不返回库存
                            part.totalQuantity -= returnQuantity;
                            part.availableQuantity -= returnQuantity;
                        }
                        
                        saveData(data);
                        document.getElementById('returnModal').classList.add('hidden');
                        
                        // 更新页面
                        if (this.currentPage === 'return') {
                            this.loadReturnList();
                        } else if (this.currentPage === 'checkout') {
                            this.loadRecentCheckouts();
                        } else if (this.currentPage === 'dashboard') {
                            this.loadPage('dashboard');
                        }
                        
                        showToast(`成功归还 ${returnQuantity} ${part.unit}`);
                    }
                }
            }

            getRecordsPage() {
                return `
                    <div class="mb-4">
                        <h2 class="text-xl font-bold mb-2">领用记录</h2>
                        <p class="text-medium">查看所有配件领用和归还记录</p>
                    </div>
                    
                    <!-- 筛选器 -->
                    <div class="flex mb-4 space-x-2">
                        <select id="recordMasterFilter" class="input-field flex-1">
                            <option value="">全部师傅</option>
                            <!-- 师傅选项将在这里动态添加 -->
                        </select>
                        <select id="recordStatusFilter" class="input-field flex-1">
                            <option value="">全部状态</option>
                            <option value="checkout">未归还</option>
                            <option value="returned">已归还</option>
                        </select>
                    </div>
                    
                    <!-- 记录列表 -->
                    <div id="recordsList" class="space-y-3">
                        <!-- 记录列表将在这里动态添加 -->
                    </div>
                `;
            }

            loadRecordsList() {
                const data = getData();
                
                // 更新师傅筛选器
                const masterFilter = document.getElementById('recordMasterFilter');
                masterFilter.innerHTML = '<option value="">全部师傅</option>';
                data.masters.forEach(master => {
                    const option = document.createElement('option');
                    option.value = master.id;
                    option.textContent = master.name;
                    masterFilter.appendChild(option);
                });
                
                // 绑定筛选事件
                masterFilter.addEventListener('change', () => {
                    this.filterRecords();
                });
                
                document.getElementById('recordStatusFilter').addEventListener('change', () => {
                    this.filterRecords();
                });
                
                // 初始加载记录列表
                this.filterRecords();
            }

            filterRecords() {
                const data = getData();
                const masterFilter = document.getElementById('recordMasterFilter').value;
                const statusFilter = document.getElementById('recordStatusFilter').value;
                
                let filteredRecords = data.records;
                
                // 按师傅筛选
                if (masterFilter) {
                    filteredRecords = filteredRecords.filter(r => r.masterId === masterFilter);
                }
                
                // 按状态筛选
                if (statusFilter) {
                    filteredRecords = filteredRecords.filter(r => r.status === statusFilter);
                }
                
                // 按时间排序（最新的在前）
                filteredRecords.sort((a, b) => new Date(b.checkoutTime) - new Date(a.checkoutTime));
                
                // 渲染记录列表
                const recordsList = document.getElementById('recordsList');
                recordsList.innerHTML = '';
                
                if (filteredRecords.length === 0) {
                    recordsList.innerHTML = `
                        <div class="py-12 text-center text-medium">
                            <i class="fa fa-file-text-o text-4xl mb-3"></i>
                            <p>没有找到符合条件的记录</p>
                        </div>
                    `;
                    return;
                }
                
                filteredRecords.forEach(record => {
                    const part = data.parts.find(p => p.id === record.partId);
                    const master = data.masters.find(m => m.id === record.masterId);
                    
                    if (part && master) {
                        const recordElement = document.createElement('div');
                        recordElement.className = 'card';
                        
                        const statusClass = record.status === 'checkout' ? 'text-primary' : 'text-success';
                        const statusIcon = record.status === 'checkout' ? 'fa-sign-out' : 'fa-sign-in';
                        const statusText = record.status === 'checkout' ? '领用' : '归还';
                        
                        let conditionHtml = '';
                        if (record.status === 'returned') {
                            conditionHtml = `<p class="text-sm"><span class="text-medium">归还状态：</span>${getStatusBadge(record.condition)}</p>`;
                        }
                        
                        recordElement.innerHTML = `
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="flex items-center">
                                        <h3 class="font-bold">${part.name}</h3>
                                        <span class="badge ${record.status === 'checkout' ? 'badge-primary' : 'badge-success'} ml-2">${statusText}</span>
                                    </div>
                                    <p class="text-sm text-medium">${part.model || '无型号'}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-lg font-bold">${record.quantity} ${part.unit}</p>
                                    <div class="flex items-center justify-end mt-1 text-xs">
                                        <i class="fa ${statusIcon} ${statusClass} mr-1"></i>
                                        <span>${master.name}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3 pt-3 border-t border-gray-100">
                                <p class="text-sm"><span class="text-medium">领用时间：</span>${formatDateTime(record.checkoutTime)}</p>
                                ${record.status === 'returned' ? `<p class="text-sm"><span class="text-medium">归还时间：</span>${formatDateTime(record.returnTime)}</p>` : ''}
                                ${conditionHtml}
                                ${record.purpose ? `<p class="text-sm"><span class="text-medium">用途：</span>${record.purpose}</p>` : ''}
                                ${record.notes ? `<p class="text-sm"><span class="text-medium">备注：</span>${record.notes}</p>` : ''}
                            </div>
                        `;
                        recordsList.appendChild(recordElement);
                    }
                });
            }

            loadMastersList() {
                const data = getData();
                const mastersList = document.getElementById('mastersList');
                mastersList.innerHTML = '';
                
                if (data.masters.length === 0) {
                    mastersList.innerHTML = `
                        <div class="py-8 text-center text-medium">
                            <i class="fa fa-user-o text-3xl mb-2"></i>
                            <p>暂无师傅信息</p>
                        </div>
                    `;
                    return;
                }
                
                data.masters.forEach(master => {
                    const masterElement = document.createElement('div');
                    masterElement.className = 'flex justify-between items-center p-3 border-b border-gray-100';
                    masterElement.innerHTML = `
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full bg-primary bg-opacity-10 flex items-center justify-center mr-3">
                                <span class="text-primary font-bold">${master.name.charAt(0)}</span>
                            </div>
                            <div>
                                <p class="font-medium">${master.name}</p>
                                <p class="text-xs text-medium">${master.phone || '无联系方式'}</p>
                            </div>
                        </div>
                        <div>
                            <button onclick="pageController.editMaster('${master.id}')" class="p-2 text-primary hover:bg-gray-100 rounded-full">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button onclick="pageController.deleteMaster('${master.id}')" class="p-2 text-danger hover:bg-gray-100 rounded-full">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    `;
                    mastersList.appendChild(masterElement);
                });
            }

            editMaster(masterId) {
                const data = getData();
                const master = data.masters.find(m => m.id === masterId);
                
                if (master) {
                    document.getElementById('editMasterTitle').textContent = '编辑师傅';
                    document.getElementById('masterId').value = master.id;
                    document.getElementById('masterName').value = master.name;
                    document.getElementById('masterPhone').value = master.phone || '';
                    document.getElementById('editMasterModal').classList.remove('hidden');
                }
            }

            deleteMaster(masterId) {
                const data = getData();
                const master = data.masters.find(m => m.id === masterId);
                
                if (master) {
                    // 检查是否有未归还的记录
                    const activeRecords = data.records.filter(r => r.masterId === masterId && r.status === 'checkout');
                    
                    if (activeRecords.length > 0) {
                        showToast('无法删除：该师傅有未归还的领用记录');
                        return;
                    }
                    
                    showConfirm(
                        '删除师傅',
                        `确定要删除师傅"${master.name}"吗？此操作无法撤销。`,
                        () => {
                            data.masters = data.masters.filter(m => m.id !== masterId);
                            saveData(data);
                            this.loadMastersList();
                            showToast('师傅已删除');
                        }
                    );
                }
            }

            saveMaster() {
                const masterId = document.getElementById('masterId').value;
                const name = document.getElementById('masterName').value.trim();
                const phone = document.getElementById('masterPhone').value.trim();
                
                if (!name) {
                    showToast('请输入师傅姓名');
                    return;
                }
                
                const data = getData();
                
                if (masterId) {
                    // 编辑现有师傅
                    const masterIndex = data.masters.findIndex(m => m.id === masterId);
                    
                    if (masterIndex !== -1) {
                        data.masters[masterIndex] = {
                            ...data.masters[masterIndex],
                            name,
                            phone
                        };
                        
                        saveData(data);
                        document.getElementById('editMasterModal').classList.add('hidden');
                        this.loadMastersList();
                        showToast('师傅信息已更新');
                    }
                } else {
                    // 添加新师傅
                    const newMaster = {
                        id: generateId('m'),
                        name,
                        phone,
                        avatar: ''
                    };
                    
                    data.masters.push(newMaster);
                    saveData(data);
                    document.getElementById('editMasterModal').classList.add('hidden');
                    this.loadMastersList();
                    showToast('师傅已添加');
                }
            }

            loadCategoriesList() {
                const data = getData();
                const categoriesList = document.getElementById('categoriesList');
                categoriesList.innerHTML = '';
                
                if (data.categories.length === 0) {
                    categoriesList.innerHTML = `
                        <div class="py-8 text-center text-medium">
                            <i class="fa fa-folder-o text-3xl mb-2"></i>
                            <p>暂无分类</p>
                        </div>
                    `;
                    return;
                }
                
                data.categories.forEach(category => {
                    // 计算该分类下的配件数量
                    const partCount = data.parts.filter(p => p.category === category.id).length;
                    
                    const categoryElement = document.createElement('div');
                    categoryElement.className = 'flex justify-between items-center p-3 border-b border-gray-100';
                    categoryElement.innerHTML = `
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center mr-3">
                                <i class="fa fa-folder text-purple-600"></i>
                            </div>
                            <div>
                                <p class="font-medium">${category.name}</p>
                                <p class="text-xs text-medium">${partCount} 个配件</p>
                            </div>
                        </div>
                        <button onclick="pageController.deleteCategory('${category.id}')" class="p-2 text-danger hover:bg-gray-100 rounded-full">
                            <i class="fa fa-trash"></i>
                        </button>
                    `;
                    categoriesList.appendChild(categoryElement);
                });
                
                // 绑定添加分类按钮
                document.getElementById('addCategoryBtn').addEventListener('click', () => {
                    const newCategory = document.getElementById('newCategoryInput').value.trim();
                    if (newCategory) {
                        this.addCategory(newCategory);
                        document.getElementById('newCategoryInput').value = '';
                    }
                });
                
                // 绑定回车键添加分类
                document.getElementById('newCategoryInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const newCategory = document.getElementById('newCategoryInput').value.trim();
                        if (newCategory) {
                            this.addCategory(newCategory);
                            document.getElementById('newCategoryInput').value = '';
                        }
                    }
                });
            }

            addCategory(name) {
                const data = getData();
                
                // 检查分类是否已存在
                if (data.categories.some(c => c.name === name)) {
                    showToast('分类已存在');
                    return;
                }
                
                const newCategory = {
                    id: generateId('c'),
                    name
                };
                
                data.categories.push(newCategory);
                saveData(data);
                this.loadCategoriesList();
                showToast('分类已添加');
            }

            deleteCategory(categoryId) {
                const data = getData();
                const category = data.categories.find(c => c.id === categoryId);
                
                if (category) {
                    // 检查是否有配件使用该分类
                    const partsInCategory = data.parts.filter(p => p.category === categoryId);
                    
                    if (partsInCategory.length > 0) {
                        showToast(`无法删除：该分类下有 ${partsInCategory.length} 个配件`);
                        return;
                    }
                    
                    showConfirm(
                        '删除分类',
                        `确定要删除分类"${category.name}"吗？此操作无法撤销。`,
                        () => {
                            data.categories = data.categories.filter(c => c.id !== categoryId);
                            saveData(data);
                            this.loadCategoriesList();
                            showToast('分类已删除');
                        }
                    );
                }
            }

            searchParts(query) {
                if (!query) {
                    document.getElementById('searchResults').innerHTML = '';
                    return;
                }
                
                const data = getData();
                const parts = data.parts;
                
                const results = parts.filter(part => 
                    part.name.toLowerCase().includes(query) || 
                    (part.model && part.model.toLowerCase().includes(query)) ||
                    (part.barcode && part.barcode.includes(query))
                );
                
                const searchResults = document.getElementById('searchResults');
                searchResults.innerHTML = '';
                
                if (results.length === 0) {
                    searchResults.innerHTML = `
                        <div class="py-8 text-center text-medium">
                            <i class="fa fa-search text-3xl mb-2"></i>
                            <p>没有找到匹配的配件</p>
                        </div>
                    `;
                    return;
                }
                
                results.forEach(part => {
                    const stockStatus = getStockStatus(part);
                    
                    const resultElement = document.createElement('div');
                    resultElement.className = 'flex justify-between items-center p-3 border-b border-gray-100 hover:bg-gray-50 cursor-pointer';
                    resultElement.onclick = () => {
                        document.getElementById('searchModal').classList.add('hidden');
                        this.loadPage('parts');
                        // 这里可以添加滚动到该配件的逻辑
                    };
                    resultElement.innerHTML = `
                        <div>
                            <p class="font-medium">${part.name}</p>
                            <p class="text-xs text-medium">${part.model || '无型号'}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold">${part.availableQuantity}/${part.totalQuantity}</p>
                            <div class="flex items-center justify-end text-xs">
                                <i class="fa ${stockStatus.icon} ${stockStatus.class} mr-1"></i>
                                <span>${stockStatus.text}</span>
                            </div>
                        </div>
                    `;
                    searchResults.appendChild(resultElement);
                });
            }

            exportData() {
                const data = getData();
                const dataStr = JSON.stringify(data, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                
                const exportFileDefaultName = `warehouse-data-${new Date().toISOString().split('T')[0]}.json`;
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                
                showToast('数据已导出');
            }

            importData(data) {
                try {
                    // 验证数据格式
                    if (!data.masters || !data.parts || !data.records) {
                        showToast('导入失败：无效的数据格式');
                        return;
                    }
                    
                    showConfirm(
                        '导入数据',
                        '此操作将覆盖当前所有数据。确定要继续吗？',
                        () => {
                            saveData(data);
                            showToast('数据已导入');
                            
                            // 重新加载当前页面
                            this.loadPage(this.currentPage);
                        }
                    );
                } catch (error) {
                    showToast('导入失败：' + error.message);
                }
            }

            startScan(type) {
                document.getElementById('scanModal').classList.remove('hidden');
                
                // 这里模拟扫码功能，实际应用中可以使用摄像头API
                // 由于浏览器安全限制，无法在演示中直接访问摄像头
                // 这里使用setTimeout模拟扫描过程
                
                setTimeout(() => {
                    this.stopScan();
                    document.getElementById('scanModal').classList.add('hidden');
                    
                    // 模拟扫描结果
                    const mockBarcodes = {
                        '1234567890123': 'p1', // 电机轴承
                        '1234567890124': 'p2', // 电阻
                        '1234567890125': 'p3', // 十字螺丝刀
                        '1234567890126': 'p4'  // 润滑油
                    };
                    
                    // 随机选择一个条码
                    const randomBarcode = Object.keys(mockBarcodes)[Math.floor(Math.random() * Object.keys(mockBarcodes).length)];
                    const partId = mockBarcodes[randomBarcode];
                    
                    if (type === 'barcode') {
                        document.getElementById('partBarcode').value = randomBarcode;
                        document.getElementById('editPartModal').classList.remove('hidden');
                    } else if (type === 'checkout' || type === 'quickCheckout') {
                        const data = getData();
                        const part = data.parts.find(p => p.id === partId);
                        
                        if (part) {
                            if (type === 'checkout') {
                                document.getElementById('checkoutPart').value = part.id;
                                document.getElementById('checkoutModal').classList.remove('hidden');
                            } else {
                                document.getElementById('quickCheckoutPart').value = part.id;
                            }
                            showToast(`已扫描: ${part.name}`);
                        } else {
                            showToast('未找到匹配的配件');
                        }
                    }
                }, 2000);
            }

            stopScan() {
                // 实际应用中，这里应该停止摄像头
            }
        }

        // 初始化应用
        const pageController = new PageController();
    </script>
</body>
</html>
