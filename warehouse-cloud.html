<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>仓库管理系统 - 云同步版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f0f1a;
            --bg2: #1a1a2e;
            --card: #252540;
            --card2: #2d2d4a;
            --gold: #f59e0b;
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --text: #f1f5f9;
            --muted: #64748b;
            --border: #3d3d5c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg2), #16213e);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--gold), #d97706);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .logo-text { font-size: 18px; font-weight: 700; }
        .logo-sub { font-size: 11px; color: var(--muted); }
        .sync-status {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--card);
        }
        .sync-status.online { color: var(--green); }
        .sync-status.offline { color: var(--red); }
        
        /* Tabs */
        .tabs {
            display: flex;
            background: var(--bg2);
            margin: 12px 16px;
            border-radius: 12px;
            padding: 4px;
            gap: 2px;
        }
        .tab {
            flex: 1;
            padding: 10px 4px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 11px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .tab.active { background: var(--card); color: var(--gold); }
        .tab-icon { font-size: 18px; }
        
        /* Panel */
        .panel { display: none; padding: 16px; }
        .panel.active { display: block; }
        
        /* Section */
        .section { margin-bottom: 20px; }
        .section-title {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-value { font-size: 28px; font-weight: 700; font-family: monospace; }
        .stat-value.green { color: var(--green); }
        .stat-value.red { color: var(--red); }
        .stat-value.gold { color: var(--gold); }
        .stat-value.blue { color: var(--blue); }
        .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
        
        /* Alert */
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-red { background: rgba(239,68,68,0.15); border: 1px solid var(--red); color: var(--red); }
        .alert-green { background: rgba(16,185,129,0.15); border: 1px solid var(--green); color: var(--green); }
        .alert-gold { background: rgba(245,158,11,0.15); border: 1px solid var(--gold); color: var(--gold); }
        
        /* Cards */
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .card-meta { font-size: 11px; color: var(--muted); }
        
        /* Part Item */
        .part-item {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .part-item:active { transform: scale(0.98); }
        .part-icon { font-size: 28px; }
        .part-info { flex: 1; }
        .part-name { font-size: 15px; font-weight: 600; }
        .part-category { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .part-stock { text-align: right; }
        .part-stock-num {
            font-size: 24px;
            font-weight: 700;
            font-family: monospace;
        }
        .part-stock-num.low { color: var(--red); }
        .part-stock-num.ok { color: var(--green); }
        .part-stock-unit { font-size: 11px; color: var(--muted); }
        .part-warning {
            font-size: 11px;
            color: var(--red);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Record Item */
        .record-item {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border-left: 4px solid var(--blue);
        }
        .record-item.out { border-left-color: var(--red); }
        .record-item.ret { border-left-color: var(--green); }
        .record-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .record-title { font-size: 14px; font-weight: 600; }
        .record-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
        .badge-out { background: rgba(239,68,68,0.2); color: var(--red); }
        .badge-ret { background: rgba(16,185,129,0.2); color: var(--green); }
        .record-meta { font-size: 12px; color: var(--muted); }
        .record-meta span { margin-right: 12px; }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg2);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 100;
        }
        .nav-item {
            flex: 1;
            padding: 12px 4px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-item.active { color: var(--gold); }
        .nav-icon { font-size: 22px; }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg2);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title { font-size: 18px; font-weight: 700; }
        .modal-close {
            width: 32px; height: 32px;
            background: var(--card);
            border: none;
            border-radius: 50%;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
        }
        
        /* Form */
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--gold);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* Number Stepper */
        .stepper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .stepper-btn {
            width: 44px; height: 44px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .stepper-btn:active { background: var(--gold); }
        .stepper-val {
            font-size: 28px;
            font-weight: 700;
            font-family: monospace;
            min-width: 50px;
            text-align: center;
        }
        
        /* Button */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 6px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--gold), #d97706); color: #000; }
        .btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: rgba(239,68,68,0.2); color: var(--red); border: 1px solid var(--red); }
        .btn:active { transform: scale(0.98); }
        
        /* Empty */
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
        }
        .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
        .empty-text { font-size: 14px; }
        
        /* Filter */
        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .filter-row .form-input, .filter-row .form-select {
            padding: 10px 12px;
            font-size: 13px;
        }
        
        /* Person tag */
        .person-tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(59,130,246,0.2);
            color: var(--blue);
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        
        /* Search */
        .search-bar {
            position: relative;
            margin-bottom: 16px;
        }
        .search-bar input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
        }
        .search-bar input::placeholder { color: var(--muted); }
        .search-bar input:focus { outline: none; border-color: var(--gold); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; }
        
        /* List item */
        .list-item {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-item-info { flex: 1; }
        .list-item-name { font-size: 14px; font-weight: 600; }
        .list-item-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .list-item-action {
            color: var(--gold);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (min-width: 500px) {
            body { padding-bottom: 0; }
            .bottom-nav { position: static; background: var(--bg2); border: none; border-top: 1px solid var(--border); }
            .modal { border-radius: 20px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); bottom: auto; max-height: 80vh; }
            .modal-overlay { align-items: center; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-icon">📦</div>
                <div>
                    <div class="logo-text">仓库管理</div>
                    <div class="logo-sub">麻章区鑫旺商行 · 云同步</div>
                </div>
            </div>
            <div class="sync-status online" id="syncStatus">☁️ 已连接</div>
        </div>
    </header>
    
    <!-- Tabs -->
    <nav class="tabs">
        <button class="tab active" data-tab="home" onclick="switchTab('home')">
            <span class="tab-icon">🏠</span>
            首页
        </button>
        <button class="tab" data-tab="parts" onclick="switchTab('parts')">
            <span class="tab-icon">🧰</span>
            配件
        </button>
        <button class="tab" data-tab="checkout" onclick="switchTab('checkout')">
            <span class="tab-icon">📤</span>
            领用
        </button>
        <button class="tab" data-tab="records" onclick="switchTab('records')">
            <span class="tab-icon">📋</span>
            记录
        </button>
    </nav>
    
    <!-- Loading -->
    <div id="loadingScreen" class="loading">
        <div class="loading-spinner"></div>
        <div>正在连接数据库...</div>
    </div>
    
    <!-- Home Panel -->
    <div id="home-panel" class="panel">
        <div class="section">
            <div class="section-title">📊 库存概览</div>
            <div class="stats-grid" id="homeStats"></div>
        </div>
        
        <div id="lowStockAlert"></div>
        
        <div class="section">
            <div class="section-title">🚨 库存预警</div>
            <div id="lowStockList"></div>
        </div>
        
        <div class="section">
            <div class="section-title">📋 今日动态</div>
            <div id="todayActivity"></div>
        </div>
    </div>
    
    <!-- Parts Panel -->
    <div id="parts-panel" class="panel">
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchParts" placeholder="搜索配件名称或型号..." oninput="filterParts()">
        </div>
        <div id="partsCategoryFilter" class="filter-row"></div>
        <div id="partsList"></div>
    </div>
    
    <!-- Checkout Panel -->
    <div id="checkout-panel" class="panel">
        <div class="section">
            <div class="section-title">📤 领用配件</div>
            <div class="card">
                <div class="form-group">
                    <label class="form-label">配件名称</label>
                    <div class="search-bar" style="margin-bottom:0;">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="checkoutSearch" placeholder="输入配件名称搜索..." oninput="searchPartsForCheckout()">
                    </div>
                    <div id="checkoutSuggestions" style="margin-top:8px;max-height:200px;overflow-y:auto;"></div>
                    <input type="hidden" id="checkoutPartId">
                    <div id="selectedPartInfo" style="display:none;margin-top:12px;padding:12px;background:var(--card2);border-radius:8px;"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">领取人</label>
                    <select class="form-select" id="checkoutPerson">
                        <option value="">请选择领取人</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">领取数量</label>
                    <div class="stepper">
                        <button class="stepper-btn" onclick="changeQty('checkoutQty', -1)">−</button>
                        <span class="stepper-val" id="checkoutQty">1</span>
                        <button class="stepper-btn" onclick="changeQty('checkoutQty', 1)">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">备注（可选）</label>
                    <input type="text" class="form-input" id="checkoutNote" placeholder="备注信息...">
                </div>
                <button class="btn btn-primary" onclick="doCheckout()">📤 确认领用</button>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">📥 归还配件</div>
            <div class="card">
                <div class="form-group">
                    <label class="form-label">配件名称</label>
                    <div class="search-bar" style="margin-bottom:0;">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="returnSearch" placeholder="输入配件名称搜索..." oninput="searchPartsForReturn()">
                    </div>
                    <div id="returnSuggestions" style="margin-top:8px;max-height:200px;overflow-y:auto;"></div>
                    <input type="hidden" id="returnPartId">
                    <div id="selectedReturnPartInfo" style="display:none;margin-top:12px;padding:12px;background:var(--card2);border-radius:8px;"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">归还人</label>
                    <select class="form-select" id="returnPerson">
                        <option value="">请选择归还人</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">归还数量</label>
                    <div class="stepper">
                        <button class="stepper-btn" onclick="changeQty('returnQty', -1)">−</button>
                        <span class="stepper-val" id="returnQty">1</span>
                        <button class="stepper-btn" onclick="changeQty('returnQty', 1)">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">备注（可选）</label>
                    <input type="text" class="form-input" id="returnNote" placeholder="备注信息...">
                </div>
                <button class="btn btn-secondary" onclick="doReturn()">📥 确认归还</button>
            </div>
        </div>
    </div>
    
    <!-- Records Panel -->
    <div id="records-panel" class="panel">
        <div class="filter-row">
            <select class="form-input" id="filterType" onchange="loadRecords()">
                <option value="">全部类型</option>
                <option value="out">领用</option>
                <option value="ret">归还</option>
            </select>
            <select class="form-input" id="filterPerson" onchange="loadRecords()">
                <option value="">全部人员</option>
            </select>
        </div>
        <div class="filter-row">
            <input type="date" class="form-input" id="filterDate" onchange="loadRecords()">
        </div>
        <div id="recordsList"></div>
    </div>
    
    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home')">
            <span class="nav-icon">🏠</span>
            首页
        </button>
        <button class="nav-item" onclick="switchTab('parts')">
            <span class="nav-icon">🧰</span>
            配件
        </button>
        <button class="nav-item" onclick="switchTab('checkout')">
            <span class="nav-icon">📤</span>
            领用
        </button>
        <button class="nav-item" onclick="switchTab('records')">
            <span class="nav-icon">📋</span>
            记录
        </button>
    </nav>
    
    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">⚙️ 系统设置</div>
                <button class="modal-close" onclick="closeModal('settingsModal')">×</button>
            </div>
            
            <div class="section">
                <div class="section-title">👷 人员管理</div>
                <div id="personList"></div>
                <button class="btn btn-secondary" onclick="showAddPerson()">➕ 添加人员</button>
            </div>
            
            <div class="section" style="margin-top:20px;">
                <div class="section-title">🗂️ 配件分类</div>
                <div id="categoryList"></div>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <input type="text" class="form-input" id="newCategoryInput" placeholder="新分类名称" style="flex:1;">
                    <button class="btn btn-secondary" onclick="addCategory()" style="width:auto;padding:12px 16px;">添加</button>
                </div>
            </div>
            
            <div class="section" style="margin-top:20px;">
                <div class="section-title">📦 配件管理</div>
                <div id="allPartsManage"></div>
                <button class="btn btn-secondary" onclick="showAddPart()">➕ 添加配件</button>
            </div>
        </div>
    </div>
    
    <!-- Add Part Modal -->
    <div class="modal-overlay" id="addPartModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="addPartTitle">➕ 添加配件</div>
                <button class="modal-close" onclick="closeModal('addPartModal')">×</button>
            </div>
            <input type="hidden" id="editPartId">
            <div class="form-group">
                <label class="form-label">配件名称 *</label>
                <input type="text" class="form-input" id="partNameInput" placeholder="如：油泵、喷油嘴">
            </div>
            <div class="form-group">
                <label class="form-label">规格型号</label>
                <input type="text" class="form-input" id="partModelInput" placeholder="如：CD-100、12V">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">库存数量</label>
                    <input type="number" class="form-input" id="partStockInput" placeholder="0" min="0">
                </div>
                <div class="form-group">
                    <label class="form-label">警戒库存</label>
                    <input type="number" class="form-input" id="partAlertInput" placeholder="5" min="0">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">分类</label>
                <select class="form-select" id="partCategoryInput"></select>
            </div>
            <div class="form-group">
                <label class="form-label">备注</label>
                <input type="text" class="form-input" id="partNoteInput" placeholder="备注信息...">
            </div>
            <button class="btn btn-primary" onclick="savePart()">💾 保存配件</button>
        </div>
    </div>

function subscribeChanges() {
    // 订阅配件变化

        .on('postgres_changes', { event: '*', schema: 'public', table: 'parts' }, payload => {
            console.log('配件变化:', payload);
            loadData().then(() => {
                if (document.querySelector('.tab.active')?.dataset.tab === 'parts') renderParts();
                if (document.querySelector('.tab.active')?.dataset.tab === 'home') renderHome();
            });
        })
        .subscribe();
    
    // 订阅记录变化
    supabase.channel('records-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'records' }, payload => {
            console.log('记录变化:', payload);
            loadData().then(() => {
                if (document.querySelector('.tab.active')?.dataset.tab === 'records') loadRecords();
                if (document.querySelector('.tab.active')?.dataset.tab === 'home') renderHome();
            });
        })
        .subscribe();
}

// ==================== 辅助函数 ====================
function getCategoryName(id) {
    const c = categories.find(x => x.id === id);
    return c ? c.name : '其他';
}

function getPersonName(id) {
    const p = persons.find(x => x.id === id);
    return p ? p.name : '未知';
}

function formatDate(d) {
    const dt = new Date(d);
    const now = new Date();
    const isToday = dt.toDateString() === now.toDateString();
    if (isToday) {
        return '今天 ' + dt.toTimeString().slice(0,5);
    }
    return `${dt.getMonth()+1}/${dt.getDate()} ${dt.toTimeString().slice(0,5)}`;
}

function getCategoryIcon(catId) {
    const icons = { 1: '⛽', 2: '💨', 3: '⚡', 4: '🔧', 5: '📦' };
    return icons[catId] || '📦';
}

function switchTab(tab) {

    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === tab + '-panel'));
    document.querySelectorAll('.nav-item').forEach((n, i) => {
        const tabs = ['home','parts','checkout','records'];
        n.classList.toggle('active', tabs[i] === tab);
    });
    
    if (tab === 'home') renderHome();
    if (tab === 'parts') renderParts();
    if (tab === 'checkout') initCheckout();
    if (tab === 'records') loadRecords();
}

    el.textContent = val;
}

async function doCheckout() {
    const partId = parseInt(document.getElementById('checkoutPartId').value);
    const personId = parseInt(document.getElementById('checkoutPerson').value);
    const qty = parseInt(document.getElementById('checkoutQty').textContent);
    const note = document.getElementById('checkoutNote').value.trim();
    
    if (!partId) return alert('请选择配件');
    if (!personId) return alert('请选择领取人');
    
    const p = parts.find(x => x.id === partId);
    if (p.stock < qty) return alert('库存不足！当前库存：' + p.stock);
    
    // 更新库存
    const { error: updateError } = await supabase
        .from('parts')
        .update({ stock: p.stock - qty })
        .eq('id', partId);
    
    if (updateError) return alert('更新库存失败：' + updateError.message);
    
    // 添加记录
    const { error: insertError } = await supabase
        .from('records')
        .insert({
            part_id: partId,
            part_name: p.name + (p.model ? ' ('+p.model+')' : ''),
            person_id: personId,
            qty,
            type: 'out',
            note
        });
    
    if (insertError) return alert('添加记录失败：' + insertError.message);
    
    alert(`✅ 领用成功！\n${p.name} × ${qty}件\n领取人：${getPersonName(personId)}`);
    initCheckout();
    switchTab('home');
}

async function doReturn() {
    const partId = parseInt(document.getElementById('returnPartId').value);
    const personId = parseInt(document.getElementById('returnPerson').value);
    const qty = parseInt(document.getElementById('returnQty').textContent);
    const note = document.getElementById('returnNote').value.trim();
    
    if (!partId) return alert('请选择配件');
    if (!personId) return alert('请选择归还人');
    
    const p = parts.find(x => x.id === partId);
    
    // 更新库存
    const { error: updateError } = await supabase
        .from('parts')
        .update({ stock: p.stock + qty })
        .eq('id', partId);
    
    if (updateError) return alert('更新库存失败：' + updateError.message);
    
    // 添加记录
    const { error: insertError } = await supabase
        .from('records')
        .insert({
            part_id: partId,
            part_name: p.name + (p.model ? ' ('+p.model+')' : ''),
            person_id: personId,
            qty,
            type: 'ret',
            note
        });
    
    if (insertError) return alert('添加记录失败：' + insertError.message);
    
    alert(`✅ 归还成功！\n${p.name} × ${qty}件\n归还人：${getPersonName(personId)}`);
    initCheckout();
    switchTab('home');
}

// ==================== 记录列表 ====================
function loadRecords() {
    const type = document.getElementById('filterType').value;
    const personId = parseInt(document.getElementById('filterPerson').value) || 0;
    const date = document.getElementById('filterDate').value;
    
    // 填充人员筛选
    const personFilter = document.getElementById('filterPerson');
    if (!personFilter.querySelector('option[value=""]')) {
        personFilter.innerHTML = '<option value="">全部人员</option>' + 
            persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }
    
    let filtered = [...records];
    if (type) filtered = filtered.filter(r => r.type === type);
    if (personId) filtered = filtered.filter(r => r.person_id === personId);
    if (date) filtered = filtered.filter(r => r.created_at.startsWith(date));
    
    if (filtered.length === 0) {
        document.getElementById('recordsList').innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">暂无记录</div></div>';
        return;
    }
    
    document.getElementById('recordsList').innerHTML = filtered.map(r => `
        <div class="record-item ${r.type}">
            <div class="record-header">
                <div class="record-title">${r.part_name}</div>
                <span class="record-badge badge-${r.type}">${r.type === 'out' ? '领用' : '归还'}</span>
            </div>
            <div class="record-meta">
                <span>👤 ${getPersonName(r.person_id)}</span>
                <span>📦 ${r.type === 'out' ? '-' : '+'}${r.qty}件</span>
                <span>⏰ ${formatDate(r.created_at)}</span>
            </div>
            ${r.note ? `<div style="font-size:12px;color:var(--muted);margin-top:4px;">📝 ${r.note}</div>` : ''}
        </div>
    `).join('');
}

// ==================== 设置 ====================
function showModal(id) {
    document.getElementById(id).classList.add('active');
    if (id === 'settingsModal') renderSettings();
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

function renderSettings() {
    // 人员列表
    document.getElementById('personList').innerHTML = persons.map(p => `
        <div class="list-item">
            <div class="list-item-info">
                <div class="list-item-name">${p.name}</div>
                <div class="list-item-meta">${p.role === 'driver' ? '司机' : p.role === 'worker' ? '工人' : '其他'}${p.phone ? ' · ' + p.phone : ''}</div>
            </div>
            <div style="display:flex;gap:8px;">
                <span class="list-item-action" onclick="editPerson(${p.id})">✏️</span>
                <span class="list-item-action" style="color:var(--red)" onclick="deletePerson(${p.id})">🗑️</span>
            </div>
        </div>
    `).join('');
    
    // 分类列表
    document.getElementById('categoryList').innerHTML = categories.map(c => `
        <div class="list-item">
            <div class="list-item-info">
                <div class="list-item-name">${getCategoryIcon(c.id)} ${c.name}</div>
            </div>
            <span class="list-item-action" style="color:var(--red)" onclick="deleteCategory(${c.id})">🗑️</span>
        </div>
    `).join('');
    
    // 配件管理
    document.getElementById('allPartsManage').innerHTML = parts.map(p => `
        <div class="list-item">
            <div class="list-item-info">
                <div class="list-item-name">${p.name}${p.model ? ' ('+p.model+')' : ''}</div>
                <div class="list-item-meta">${getCategoryName(p.category_id)} · 库存 ${p.stock}</div>
            </div>
            <div style="display:flex;gap:8px;">
                <span class="list-item-action" onclick="editPart(${p.id})">✏️</span>
                <span class="list-item-action" style="color:var(--red)" onclick="deletePart(${p.id})">🗑️</span>
            </div>
        </div>
    `).join('');
    
    // 填充分类下拉
    document.getElementById('partCategoryInput').innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

function showAddPerson() {
    document.getElementById('editPersonId').value = '';
    document.getElementById('personNameInput').value = '';
    document.getElementById('personPhoneInput').value = '';
    document.getElementById('personRoleInput').value = 'driver';
    showModal('addPersonModal');
}

function editPerson(id) {
    const p = persons.find(x => x.id === id);
    if (!p) return;
    document.getElementById('editPersonId').value = id;
    document.getElementById('personNameInput').value = p.name;
    document.getElementById('personPhoneInput').value = p.phone || '';
    document.getElementById('personRoleInput').value = p.role || 'driver';
    showModal('addPersonModal');
}

async function savePerson() {
    const name = document.getElementById('personNameInput').value.trim();
    const phone = document.getElementById('personPhoneInput').value.trim();
    const role = document.getElementById('personRoleInput').value;
    const editId = document.getElementById('editPersonId').value;
    
    if (!name) return alert('请输入姓名');
    
    if (editId) {
        const { error } = await supabase
            .from('persons')
            .update({ name, phone, role })
            .eq('id', parseInt(editId));
        if (error) return alert('更新失败：' + error.message);
    } else {
        const { error } = await supabase
            .from('persons')
            .insert({ name, phone, role });
        if (error) return alert('添加失败：' + error.message);
    }
    
    await loadData();
    closeModal('addPersonModal');
    renderSettings();
}

async function deletePerson(id) {
    if (!confirm('确定删除该人员？')) return;
    const { error } = await supabase.from('persons').delete().eq('id', id);
    if (error) return alert('删除失败：' + error.message);
    await loadData();
    renderSettings();
}

async function addCategory() {
    const name = document.getElementById('newCategoryInput').value.trim();
    if (!name) return;
    const { error } = await supabase.from('categories').insert({ name });
    if (error) return alert('添加失败：' + error.message);
    document.getElementById('newCategoryInput').value = '';
    await loadData();
    renderSettings();
}

async function deleteCategory(id) {
    const hasParts = parts.some(p => p.category_id === id);
    if (hasParts) return alert('该分类下有配件，无法删除');
    if (!confirm('确定删除该分类？')) return;
    const { error } = await supabase.from('categories').delete().eq('id', id);
    if (error) return alert('删除失败：' + error.message);
    await loadData();
    renderSettings();
}

function showAddPart() {
    document.getElementById('editPartId').value = '';
    document.getElementById('addPartTitle').textContent = '➕ 添加配件';
    document.getElementById('partNameInput').value = '';
    document.getElementById('partModelInput').value = '';
    document.getElementById('partStockInput').value = '0';
    document.getElementById('partAlertInput').value = '5';
    document.getElementById('partNoteInput').value = '';
    document.getElementById('partCategoryInput').value = categories[0]?.id || 1;
    showModal('addPartModal');
}

function editPart(id) {
    const p = parts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('editPartId').value = id;
    document.getElementById('addPartTitle').textContent = '✏️ 编辑配件';
    document.getElementById('partNameInput').value = p.name;
    document.getElementById('partModelInput').value = p.model || '';
    document.getElementById('partStockInput').value = p.stock;
    document.getElementById('partAlertInput').value = p.alert_stock;
    document.getElementById('partNoteInput').value = p.note || '';
    document.getElementById('partCategoryInput').value = p.category_id;
    showModal('addPartModal');
}

async function savePart() {
    const name = document.getElementById('partNameInput').value.trim();
    const model = document.getElementById('partModelInput').value.trim();
    const stock = parseInt(document.getElementById('partStockInput').value) || 0;
    const alert_stock = parseInt(document.getElementById('partAlertInput').value) || 5;
    const category_id = parseInt(document.getElementById('partCategoryInput').value) || 1;
    const note = document.getElementById('partNoteInput').value.trim();
    const editId = document.getElementById('editPartId').value;
    
    if (!name) return alert('请输入配件名称');
    
    if (editId) {
        const { error } = await supabase
            .from('parts')
            .update({ name, model, stock, alert_stock, category_id, note })
            .eq('id', parseInt(editId));
        if (error) return alert('更新失败：' + error.message);
    } else {
        const { error } = await supabase
            .from('parts')
            .insert({ name, model, stock, alert_stock, category_id, note });
        if (error) return alert('添加失败：' + error.message);
    }
    
    await loadData();
    closeModal('addPartModal');
    renderSettings();
}

async function deletePart(id) {
    if (!confirm('确定删除该配件？')) return;
    const { error } = await supabase.from('parts').delete().eq('id', id);
    if (error) return alert('删除失败：' + error.message);
    await loadData();
    renderSettings();
}

// ==================== 启动 ====================
document.addEventListener('DOMContentLoaded', () => {
    init();
    
    // 点击空白关闭弹窗
    document.querySelectorAll('.modal-overlay').forEach(m => {
        m.addEventListener('click', e => {
            if (e.target === m) m.classList.remove('active');
        });
    });
});
</script>
