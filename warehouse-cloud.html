<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>仓库管理</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #0f0f1a; color: #f1f5f9; min-height: 100vh; padding-bottom: 80px; }
        .header { background: #1a1a2e; padding: 16px 20px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #3d3d5c; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 18px; font-weight: 700; }
        .logo-sub { font-size: 11px; color: #64748b; }
        .sync-status { font-size: 11px; padding: 4px 10px; border-radius: 12px; background: #252540; color: #10b981; }
        .tabs { display: flex; background: #1a1a2e; margin: 12px 16px; border-radius: 12px; padding: 4px; gap: 2px; }
        .tab { flex: 1; padding: 10px 4px; background: none; border: none; color: #64748b; font-size: 11px; font-weight: 500; border-radius: 8px; cursor: pointer; }
        .tab.active { background: #252540; color: #f59e0b; }
        .panel { display: none; padding: 16px; }
        .panel.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-card { background: #252540; border-radius: 12px; padding: 16px; text-align: center; border: 1px solid #3d3d5c; }
        .stat-value { font-size: 28px; font-weight: 700; font-family: monospace; }
        .stat-value.green { color: #10b981; }
        .stat-value.red { color: #ef4444; }
        .stat-value.gold { color: #f59e0b; }
        .stat-value.blue { color: #3b82f6; }
        .stat-label { font-size: 11px; color: #64748b; margin-top: 2px; }
        .card { background: #252540; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid #3d3d5c; }
        .alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; }
        .alert-red { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #ef4444; }
        .alert-green { background: rgba(16,185,129,0.15); border: 1px solid #10b981; color: #10b981; }
        .section-title { font-size: 12px; color: #64748b; margin-bottom: 10px; text-transform: uppercase; }
        .section { margin-bottom: 20px; }
        .loading { text-align: center; padding: 40px; color: #64748b; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e; border-top: 1px solid #3d3d5c; display: flex; z-index: 100; }
        .nav-item { flex: 1; padding: 12px 4px; background: none; border: none; color: #64748b; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: #f59e0b; }
        .nav-icon { font-size: 22px; display: block; margin-bottom: 4px; }
        .form-group { margin-bottom: 14px; }
        .form-input, .form-select { width: 100%; padding: 12px 14px; background: #252540; border: 1px solid #3d3d5c; border-radius: 10px; color: #f1f5f9; font-size: 15px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn-primary { background: #f59e0b; color: #000; }
        .btn-secondary { background: #2d2d4a; color: #f1f5f9; border: 1px solid #3d3d5c; }
        .empty { text-align: center; padding: 50px 20px; color: #64748b; }
        .person-tag { display: inline-block; padding: 2px 8px; background: rgba(59,130,246,0.2); color: #3b82f6; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1a1a2e; border-radius: 20px 20px 0 0; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 700; }
        .modal-close { width: 32px; height: 32px; background: #252540; border: none; border-radius: 50%; color: #f1f5f9; font-size: 18px; cursor: pointer; }
        .stepper { display: flex; align-items: center; gap: 12px; justify-content: center; }
        .stepper-btn { width: 44px; height: 44px; background: #2d2d4a; border: 1px solid #3d3d5c; border-radius: 10px; color: #f1f5f9; font-size: 20px; cursor: pointer; }
        .stepper-val { font-size: 28px; font-weight: 700; font-family: monospace; min-width: 50px; text-align: center; }
        .record-item { background: #252540; border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
        .record-item.out { border-left-color: #ef4444; }
        .record-item.ret { border-left-color: #10b981; }
        .record-meta { font-size: 12px; color: #64748b; }
        .record-meta span { margin-right: 12px; }
        .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .search-bar { position: relative; margin-bottom: 16px; }
        .search-bar input { width: 100%; padding: 12px 14px 12px 40px; background: #252540; border: 1px solid #3d3d5c; border-radius: 12px; color: #f1f5f9; font-size: 15px; box-sizing: border-box; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
    </style>
</head>
<body>
<header class="header">
    <div class="header-top">
        <div class="logo">
            <div class="logo-icon">📦</div>
            <div>
                <div class="logo-text">仓库管理</div>
                <div class="logo-sub">麻章区鑫旺商行 · 云同步</div>
            </div>
        </div>
        <div class="sync-status" id="syncStatus">☁️ 已连接</div>
    </div>
</header>

<nav class="tabs">
    <button class="tab active" data-tab="home">🏠 首页</button>
    <button class="tab" data-tab="parts">🧰 配件</button>
    <button class="tab" data-tab="checkout">📤 领用</button>
    <button class="tab" data-tab="records">📋 记录</button>
</nav>

<div id="loadingScreen" class="loading">正在连接数据库...</div>

<div id="home-panel" class="panel">
    <div class="section">
        <div class="section-title">📊 库存概览</div>
        <div class="stats-grid" id="homeStats"></div>
    </div>
    <div id="lowStockAlert"></div>
    <div class="section">
        <div class="section-title">🚨 库存预警</div>
        <div id="lowStockList"></div>
    </div>
</div>

<div id="parts-panel" class="panel">
    <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchParts" placeholder="搜索配件..." oninput="filterParts()">
    </div>
    <div id="partsList"></div>
</div>

<div id="checkout-panel" class="panel">
    <div class="section">
        <div class="section-title">📤 领用配件</div>
        <div class="card">
            <div class="form-group">
                <label class="section-title">配件名称</label>
                <div class="search-bar" style="margin-bottom:0;">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="checkoutSearch" placeholder="输入配件名称搜索..." oninput="searchPartsForCheckout()">
                </div>
                <div id="checkoutSuggestions" style="margin-top:8px;max-height:200px;overflow-y:auto;"></div>
                <input type="hidden" id="checkoutPartId">
                <div id="selectedPartInfo" style="display:none;margin-top:12px;padding:12px;background:#2d2d4a;border-radius:8px;"></div>
            </div>
            <div class="form-group">
                <label class="section-title">领取人</label>
                <select class="form-select" id="checkoutPerson">
                    <option value="">请选择</option>
                </select>
            </div>
            <div class="form-group">
                <label class="section-title">数量</label>
                <div class="stepper">
                    <button class="stepper-btn" onclick="changeQty('checkoutQty', -1)">−</button>
                    <span class="stepper-val" id="checkoutQty">1</span>
                    <button class="stepper-btn" onclick="changeQty('checkoutQty', 1)">+</button>
                </div>
            </div>
            <button class="btn btn-primary" onclick="doCheckout()">📤 确认领用</button>
        </div>
    </div>
    <div class="section">
        <div class="section-title">📥 归还配件</div>
        <div class="card">
            <div class="form-group">
                <label class="section-title">配件名称</label>
                <div class="search-bar" style="margin-bottom:0;">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="returnSearch" placeholder="输入配件名称搜索..." oninput="searchPartsForReturn()">
                </div>
                <div id="returnSuggestions" style="margin-top:8px;max-height:200px;overflow-y:auto;"></div>
                <input type="hidden" id="returnPartId">
                <div id="selectedReturnPartInfo" style="display:none;margin-top:12px;padding:12px;background:#2d2d4a;border-radius:8px;"></div>
            </div>
            <div class="form-group">
                <label class="section-title">归还人</label>
                <select class="form-select" id="returnPerson">
                    <option value="">请选择</option>
                </select>
            </div>
            <div class="form-group">
                <label class="section-title">数量</label>
                <div class="stepper">
                    <button class="stepper-btn" onclick="changeQty('returnQty', -1)">−</button>
                    <span class="stepper-val" id="returnQty">1</span>
                    <button class="stepper-btn" onclick="changeQty('returnQty', 1)">+</button>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="doReturn()">📥 确认归还</button>
        </div>
    </div>
</div>

<div id="records-panel" class="panel">
    <div class="filter-row">
        <select class="form-input" id="filterType" onchange="loadRecords()">
            <option value="">全部类型</option>
            <option value="out">领用</option>
            <option value="ret">归还</option>
        </select>
        <select class="form-input" id="filterPerson" onchange="loadRecords()">
            <option value="">全部人员</option>
        </select>
    </div>
    <div id="recordsList"></div>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('home')"><span class="nav-icon">🏠</span>首页</button>
    <button class="nav-item" onclick="switchTab('parts')"><span class="nav-icon">🧰</span>配件</button>
    <button class="nav-item" onclick="switchTab('checkout')"><span class="nav-icon">📤</span>领用</button>
    <button class="nav-item" onclick="switchTab('records')"><span class="nav-icon">📋</span>记录</button>
</nav>

<div class="modal-overlay" id="partDetailModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="detailTitle">配件详情</div>
            <button class="modal-close" onclick="document.getElementById('partDetailModal').classList.remove('active')">×</button>
        </div>
        <div id="detailContent"></div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://xtwirqahbthencfeqczr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0d2lycWFoYnRoZW5jZmVxY3pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMjg0NTcsImV4cCI6MjEwMDcwNDQ1N30.RumLwT0WhYccjstZ6_mrDvt4OzQc0IXy-x3GPCYekuM';

let db = null;
let categories = [];
let persons = [];
let parts = [];
let records = [];

window.addEventListener('error', function(e) {
    document.getElementById('loadingScreen').innerHTML = 
        '<div style="color:#ef4444;">❌ 加载错误</div>' +
        '<div style="font-size:12px;margin-top:8px;color:#64748b;">' + e.message + '</div>';
});

async function init() {
    console.log('1. 初始化开始');
    try {
        console.log('2. 创建 supabase client');
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('3. client 已创建');
        
        console.log('4. 加载数据...');
        await loadData();
        console.log('5. 数据加载完成');
        
        console.log('6. 隐藏加载页');
        document.getElementById('loadingScreen').style.display = 'none';
        renderHome();
        console.log('7. 首页渲染完成');
    } catch (e) {
        console.error('Init error:', e);
        document.getElementById('loadingScreen').innerHTML = 
            '<div style="color:#ef4444;">❌ 连接失败</div>' +
            '<div style="font-size:12px;margin-top:8px;color:#64748b;max-width:400px;word-wrap:break-word;">' + (e.message || JSON.stringify(e)) + '</div>' +
            '<button class="btn btn-primary" onclick="location.reload()" style="width:auto;margin-top:16px;">重试</button>';
    }
}

async function loadData() {
    console.log('加载分类...');
    const { data: catData, error: catErr } = await db.from('categories').select('*').order('id');
    if (catErr) throw new Error('分类加载失败: ' + catErr.message);
    categories = catData || [];
    console.log('分类:', categories.length);
    
    console.log('加载人员...');
    const { data: personData, error: personErr } = await db.from('persons').select('*').order('id');
    if (personErr) throw new Error('人员加载失败: ' + personErr.message);
    persons = personData || [];
    console.log('人员:', persons.length);
    
    console.log('加载配件...');
    const { data: partData, error: partErr } = await db.from('parts').select('*').order('id');
    if (partErr) throw new Error('配件加载失败: ' + partErr.message);
    parts = partData || [];
    console.log('配件:', parts.length);
    
    console.log('加载记录...');
    const { data: recordData, error: recErr } = await db.from('records').select('*').order('created_at', { ascending: false });
    if (recErr) throw new Error('记录加载失败: ' + recErr.message);
    records = recordData || [];
    console.log('记录:', records.length);
}

function getCategoryName(id) {
    const c = categories.find(x => x.id === id);
    return c ? c.name : '其他';
}

function getPersonName(id) {
    const p = persons.find(x => x.id === id);
    return p ? p.name : '未知';
}

function formatDate(d) {
    const dt = new Date(d);
    const now = new Date();
    if (dt.toDateString() === now.toDateString()) {
        return '今天 ' + dt.toTimeString().slice(0,5);
    }
    return (dt.getMonth()+1) + '/' + dt.getDate() + ' ' + dt.toTimeString().slice(0,5);
}

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === tab + '-panel'));
    document.querySelectorAll('.nav-item').forEach((n, i) => {
        const tabs = ['home','parts','checkout','records'];
        n.classList.toggle('active', tabs[i] === tab);
    });
    
    if (tab === 'home') renderHome();
    if (tab === 'parts') renderParts();
    if (tab === 'checkout') initCheckout();
    if (tab === 'records') loadRecords();
}

function renderHome() {
    const totalStock = parts.reduce((s, p) => s + p.stock, 0);
    const lowStock = parts.filter(p => p.stock <= p.alert_stock);
    const now = new Date();
    const todayRecords = records.filter(r => new Date(r.created_at).toDateString() === now.toDateString());
    const outToday = todayRecords.filter(r => r.type === 'out').length;
    
    document.getElementById('homeStats').innerHTML = `
        <div class="stat-card"><div class="stat-value green">${totalStock}</div><div class="stat-label">总库存</div></div>
        <div class="stat-card"><div class="stat-value blue">${parts.length}</div><div class="stat-label">配件种类</div></div>
        <div class="stat-card"><div class="stat-value gold">${outToday}</div><div class="stat-label">今日领用</div></div>
        <div class="stat-card"><div class="stat-value red">${lowStock.length}</div><div class="stat-label">库存预警</div></div>
    `;
    
    if (lowStock.length > 0) {
        document.getElementById('lowStockAlert').innerHTML = '<div class="alert alert-red">⚠️ 有 ' + lowStock.length + ' 种配件库存低于警戒线！</div>';
        document.getElementById('lowStockList').innerHTML = lowStock.map(p => `
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <div style="font-weight:600;">${p.name}${p.model ? ' (' + p.model + ')' : ''}</div>
                        <div style="font-size:11px;color:#64748b;">${getCategoryName(p.category_id)} · 警戒：${p.alert_stock}</div>
                    </div>
                    <div style="font-size:24px;font-weight:700;color:#ef4444;font-family:monospace;">${p.stock}</div>
                </div>
            </div>
        `).join('');
    } else {
        document.getElementById('lowStockAlert').innerHTML = '<div class="alert alert-green">✅ 所有配件库存正常</div>';
        document.getElementById('lowStockList').innerHTML = '';
    }
}

function renderParts() {
    filterParts();
}

function filterParts() {
    const search = document.getElementById('searchParts').value.toLowerCase();
    let filtered = [...parts];
    if (search) filtered = filtered.filter(p => 
        p.name.toLowerCase().includes(search) || 
        (p.model && p.model.toLowerCase().includes(search))
    );
    
    if (filtered.length === 0) {
        document.getElementById('partsList').innerHTML = '<div class="empty">没有找到配件</div>';
        return;
    }
    
    document.getElementById('partsList').innerHTML = filtered.map(p => {
        const isLow = p.stock <= p.alert_stock;
        return `
            <div class="card" onclick="showPartDetail(${p.id})" style="cursor:pointer;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <div style="font-weight:600;">${p.name}${p.model ? ' (' + p.model + ')' : ''}</div>
                        <div style="font-size:11px;color:#64748b;">${getCategoryName(p.category_id)}${isLow ? ' · ⚠️低于警戒' : ''}</div>
                    </div>
                    <div style="font-size:24px;font-weight:700;color:${isLow?'#ef4444':'#10b981'};font-family:monospace;">${p.stock}</div>
                </div>
            </div>
        `;
    }).join('');
}

function showPartDetail(id) {
    const p = parts.find(x => x.id === id);
    if (!p) return;
    const isLow = p.stock <= p.alert_stock;
    const hist = records.filter(r => r.part_id === id).slice(0, 10);
    
    document.getElementById('detailTitle').textContent = p.name + (p.model ? ' (' + p.model + ')' : '');
    document.getElementById('detailContent').innerHTML = `
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value ${isLow ? 'red' : 'green'}">${p.stock}</div><div class="stat-label">当前库存</div></div>
            <div class="stat-card"><div class="stat-value gold">${p.alert_stock}</div><div class="stat-label">警戒库存</div></div>
        </div>
        <div class="section-title" style="margin-top:16px;">📋 最近记录</div>
        ${hist.length === 0 ? '<div class="empty">暂无记录</div>' : hist.map(r => `
            <div class="record-item ${r.type}">
                <div style="font-weight:600;margin-bottom:4px;">${r.type === 'out' ? '📤 领用' : '📥 归还'} ${r.qty}件</div>
                <div class="record-meta">
                    <span>👤 ${getPersonName(r.person_id)}</span>
                    <span>⏰ ${formatDate(r.created_at)}</span>
                </div>
            </div>
        `).join('')}
    `;
    document.getElementById('partDetailModal').classList.add('active');
}

function initCheckout() {
    const personOptions = persons.map(p => '<option value="' + p.id + '">' + p.name + '</option>').join('');
    document.getElementById('checkoutPerson').innerHTML = '<option value="">请选择</option>' + personOptions;
    document.getElementById('returnPerson').innerHTML = '<option value="">请选择</option>' + personOptions;
    
    document.getElementById('checkoutSearch').value = '';
    document.getElementById('returnSearch').value = '';
    document.getElementById('checkoutSuggestions').innerHTML = '';
    document.getElementById('returnSuggestions').innerHTML = '';
    document.getElementById('selectedPartInfo').style.display = 'none';
    document.getElementById('selectedReturnPartInfo').style.display = 'none';
    document.getElementById('checkoutQty').textContent = '1';
    document.getElementById('returnQty').textContent = '1';
}

function searchPartsForCheckout() {
    const query = document.getElementById('checkoutSearch').value.toLowerCase().trim();
    const suggestions = document.getElementById('checkoutSuggestions');
    if (!query) { suggestions.innerHTML = ''; return; }
    
    const filtered = parts.filter(p => 
        p.name.toLowerCase().includes(query) || 
        (p.model && p.model.toLowerCase().includes(query))
    );
    if (filtered.length === 0) {
        suggestions.innerHTML = '<div style="padding:12px;color:#64748b;font-size:13px;">未找到配件</div>';
        return;
    }
    suggestions.innerHTML = filtered.map(p => `
        <div class="card" style="margin-bottom:8px;cursor:pointer;" onclick="selectPartForCheckout(${p.id})">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <div><div style="font-weight:600;">${p.name}${p.model ? ' <span style="font-size:12px;color:#64748b">'+p.model+'</span>' : ''}</div></div>
                <div style="font-size:20px;font-weight:700;color:${p.stock <= p.alert_stock ? '#ef4444' : '#10b981'};font-family:monospace;">${p.stock}</div>
            </div>
        </div>
    `).join('');
}

function selectPartForCheckout(id) {
    const p = parts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('checkoutPartId').value = id;
    document.getElementById('checkoutSearch').value = '';
    document.getElementById('checkoutSuggestions').innerHTML = '';
    document.getElementById('selectedPartInfo').style.display = 'block';
    document.getElementById('selectedPartInfo').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <div><div style="font-weight:600;">✓ ${p.name}${p.model ? ' ('+p.model+')' : ''}</div></div>
            <div style="font-size:24px;font-weight:700;color:#10b981;font-family:monospace;">${p.stock}</div>
        </div>
    `;
    document.getElementById('checkoutQty').dataset.max = p.stock;
    document.getElementById('checkoutQty').textContent = '1';
}

function searchPartsForReturn() {
    const query = document.getElementById('returnSearch').value.toLowerCase().trim();
    const suggestions = document.getElementById('returnSuggestions');
    if (!query) { suggestions.innerHTML = ''; return; }
    
    const filtered = parts.filter(p => 
        p.name.toLowerCase().includes(query) || 
        (p.model && p.model.toLowerCase().includes(query))
    );
    if (filtered.length === 0) {
        suggestions.innerHTML = '<div style="padding:12px;color:#64748b;font-size:13px;">未找到配件</div>';
        return;
    }
    suggestions.innerHTML = filtered.map(p => `
        <div class="card" style="margin-bottom:8px;cursor:pointer;" onclick="selectPartForReturn(${p.id})">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <div><div style="font-weight:600;">${p.name}${p.model ? ' <span style="font-size:12px;color:#64748b">'+p.model+'</span>' : ''}</div></div>
                <div style="font-size:20px;font-weight:700;color:#10b981;font-family:monospace;">${p.stock}</div>
            </div>
        </div>
    `).join('');
}

function selectPartForReturn(id) {
    const p = parts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('returnPartId').value = id;
    document.getElementById('returnSearch').value = '';
    document.getElementById('returnSuggestions').innerHTML = '';
    document.getElementById('selectedReturnPartInfo').style.display = 'block';
    document.getElementById('selectedReturnPartInfo').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <div><div style="font-weight:600;">✓ ${p.name}${p.model ? ' ('+p.model+')' : ''}</div></div>
            <div style="font-size:24px;font-weight:700;color:#10b981;font-family:monospace;">${p.stock}</div>
        </div>
    `;
    document.getElementById('returnQty').textContent = '1';
}

function changeQty(id, delta) {
    const el = document.getElementById(id);
    let val = parseInt(el.textContent);
    const max = parseInt(el.dataset.max) || 9999;
    val = Math.max(1, Math.min(max, val + delta));
    el.textContent = val;
}

async function doCheckout() {
    const partId = parseInt(document.getElementById('checkoutPartId').value);
    const personId = parseInt(document.getElementById('checkoutPerson').value);
    const qty = parseInt(document.getElementById('checkoutQty').textContent);
    
    if (!partId) return alert('请选择配件');
    if (!personId) return alert('请选择领取人');
    
    const p = parts.find(x => x.id === partId);
    if (p.stock < qty) return alert('库存不足！当前库存：' + p.stock);
    
    const { error: e1 } = await db.from('parts').update({ stock: p.stock - qty }).eq('id', partId);
    if (e1) return alert('更新失败：' + e1.message);
    
    const { error: e2 } = await db.from('records').insert({
        part_id: partId,
        part_name: p.name + (p.model ? ' ('+p.model+')' : ''),
        person_id: personId,
        qty: qty,
        type: 'out'
    });
    if (e2) return alert('记录失败：' + e2.message);
    
    await loadData();
    alert('✅ 领用成功！');
    initCheckout();
    switchTab('home');
}

async function doReturn() {
    const partId = parseInt(document.getElementById('returnPartId').value);
    const personId = parseInt(document.getElementById('returnPerson').value);
    const qty = parseInt(document.getElementById('returnQty').textContent);
    
    if (!partId) return alert('请选择配件');
    if (!personId) return alert('请选择归还人');
    
    const p = parts.find(x => x.id === partId);
    
    const { error: e1 } = await db.from('parts').update({ stock: p.stock + qty }).eq('id', partId);
    if (e1) return alert('更新失败：' + e1.message);
    
    const { error: e2 } = await db.from('records').insert({
        part_id: partId,
        part_name: p.name + (p.model ? ' ('+p.model+')' : ''),
        person_id: personId,
        qty: qty,
        type: 'ret'
    });
    if (e2) return alert('记录失败：' + e2.message);
    
    await loadData();
    alert('✅ 归还成功！');
    initCheckout();
    switchTab('home');
}

function loadRecords() {
    const type = document.getElementById('filterType').value;
    const personId = parseInt(document.getElementById('filterPerson').value) || 0;
    
    const personFilter = document.getElementById('filterPerson');
    if (personFilter.options.length <= 1) {
        personFilter.innerHTML = '<option value="">全部人员</option>' + 
            persons.map(p => '<option value="' + p.id + '">' + p.name + '</option>').join('');
    }
    
    let filtered = [...records];
    if (type) filtered = filtered.filter(r => r.type === type);
    if (personId) filtered = filtered.filter(r => r.person_id === personId);
    
    if (filtered.length === 0) {
        document.getElementById('recordsList').innerHTML = '<div class="empty">暂无记录</div>';
        return;
    }
    
    document.getElementById('recordsList').innerHTML = filtered.map(r => `
        <div class="record-item ${r.type}">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                <div style="font-weight:600;">${r.part_name}</div>
                <div style="font-size:13px;font-weight:700;color:${r.type==='out'?'#ef4444':'#10b981'};">${r.type==='out'?'-':'+'}${r.qty}件</div>
            </div>
            <div class="record-meta">
                <span>👤 ${getPersonName(r.person_id)}</span>
                <span>⏰ ${formatDate(r.created_at)}</span>
            </div>
        </div>
    `).join('');
}

// Tab 点击
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

document.addEventListener('DOMContentLoaded', () => {
    console.log('DOM ready, starting init');
    init();
});
</script>
</body>
